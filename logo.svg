<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3b1f8c"/>
      <stop offset="60%" stop-color="#1e1260"/>
      <stop offset="100%" stop-color="#08051a"/>
    </radialGradient>
    <linearGradient id="gP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gO" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="76" fill="url(#bg)"/>
  <ellipse cx="256" cy="265" rx="150" ry="120" fill="#f97316" opacity="0.14" filter="url(#glow)"/>
  <!-- Left card purple -->
  <g transform="rotate(-22 185 270)">
    <rect x="90" y="148" width="118" height="162" rx="18" fill="url(#gP)" filter="url(#sh)"/>
    <rect x="90" y="148" width="118" height="62" rx="18" fill="white" opacity="0.08"/>
    <text x="149" y="260" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="86" font-weight="900" fill="white" opacity="0.9">?</text>
  </g>
  <!-- Teal card -->
  <g transform="rotate(-9 218 258)">
    <rect x="134" y="136" width="118" height="162" rx="18" fill="url(#gT)" filter="url(#sh)"/>
    <rect x="134" y="136" width="118" height="62" rx="18" fill="white" opacity="0.08"/>
  </g>
  <!-- Orange center card with bulb -->
  <g transform="rotate(-2 256 258)">
    <rect x="178" y="126" width="126" height="170" rx="18" fill="url(#gO)" filter="url(#sh)"/>
    <rect x="178" y="126" width="126" height="70" rx="18" fill="white" opacity="0.1"/>
    <rect x="178" y="126" width="126" height="170" rx="18" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <circle cx="241" cy="225" r="29" fill="none" stroke="white" stroke-width="5.5" opacity="0.92"/>
    <path d="M228 252 Q241 265 254 252" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="234" y1="259" x2="248" y2="259" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="241" y1="185" x2="241" y2="176" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="271" y1="196" x2="278" y2="189" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="211" y1="196" x2="204" y2="189" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Yellow right card with checkmark -->
  <g transform="rotate(20 320 270)">
    <rect x="260" y="148" width="118" height="162" rx="18" fill="url(#gY)" filter="url(#sh)"/>
    <rect x="260" y="148" width="118" height="62" rx="18" fill="white" opacity="0.1"/>
    <polyline points="276,235 299,262 346,205" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  </g>
  <!-- Sparkles -->
  <circle cx="110" cy="146" r="5" fill="#fbbf24" opacity="0.6"/>
  <line x1="110" y1="110" x2="110" y2="128" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="101" y1="119" x2="119" y2="119" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="392" cy="130" r="4" fill="#a855f7" opacity="0.7"/>
  <line x1="392" y1="172" x2="392" y2="188" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="384" y1="180" x2="400" y2="180" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
