<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3b1f8c"/>
      <stop offset="60%" stop-color="#1e1260"/>
      <stop offset="100%" stop-color="#08051a"/>
    </radialGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="76" fill="url(#bg)"/>

  <!-- Ambient glow center -->
  <ellipse cx="252" cy="195" rx="130" ry="100" fill="#8b5cf6" opacity="0.08"/>
  <!-- Orange glow around center card -->
  <ellipse cx="248" cy="200" rx="95" ry="80" fill="#f97316" opacity="0.18" filter="url(#glow)"/>

  <!-- ─── LEFT CARD (purple, ?) ─── -->
  <g transform="rotate(-22 180 195)">
    <rect x="126" y="118" width="108" height="148" rx="18" fill="url(#gPurple)" filter="url(#cardShadow)"/>
    <rect x="126" y="118" width="108" height="62" rx="18" fill="white" opacity="0.08"/>
    <text x="180" y="210" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="78" font-weight="900" fill="white" opacity="0.92">?</text>
  </g>

  <!-- ─── TEAL CARD (second, partially visible) ─── -->
  <g transform="rotate(-9 218 188)">
    <rect x="164" y="108" width="108" height="148" rx="18" fill="url(#gTeal)" filter="url(#cardShadow)"/>
    <rect x="164" y="108" width="108" height="62" rx="18" fill="white" opacity="0.08"/>
  </g>

  <!-- ─── ORANGE CARD (center, glowing) ─── -->
  <g transform="rotate(-2 252 185)">
    <rect x="198" y="100" width="112" height="152" rx="18" fill="url(#gOrange)" filter="url(#cardShadow)"/>
    <!-- Glow rim -->
    <rect x="198" y="100" width="112" height="152" rx="18" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <rect x="198" y="100" width="112" height="68" rx="18" fill="white" opacity="0.1"/>
    <!-- Lightbulb -->
    <circle cx="254" cy="176" r="26" fill="none" stroke="white" stroke-width="5.5" opacity="0.92"/>
    <path d="M242 200 Q254 212 266 200" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
    <line x1="248" y1="207" x2="260" y2="207" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.92"/>
    <line x1="254" y1="142" x2="254" y2="134" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="282" y1="152" x2="288" y2="146" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="226" y1="152" x2="220" y2="146" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ─── YELLOW CARD (right, ✓) ─── -->
  <g transform="rotate(20 318 200)">
    <rect x="264" y="120" width="108" height="148" rx="18" fill="url(#gYellow)" filter="url(#cardShadow)"/>
    <rect x="264" y="120" width="108" height="62" rx="18" fill="white" opacity="0.1"/>
    <polyline points="283,196 305,222 350,166" fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  </g>

  <!-- Text glow layer (purple) -->
  <text x="256" y="370" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="64" font-weight="900" fill="#9333ea" filter="url(#glowText)" opacity="0.75">Karteikarten</text>
  <text x="256" y="448" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="64" font-weight="900" fill="#9333ea" filter="url(#glowText)" opacity="0.75">Manager</text>

  <!-- Text (white) -->
  <text x="256" y="364" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="60" font-weight="900" fill="white">Karteikarten</text>
  <text x="256" y="442" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="60" font-weight="900" fill="white">Manager</text>

  <!-- Sparkles -->
  <circle cx="108" cy="112" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="390" cy="98" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="420" cy="340" r="5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="78" cy="360" r="3" fill="#8b5cf6" opacity="0.5"/>
  <line x1="128" y1="80" x2="128" y2="96" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="120" y1="88" x2="136" y2="88" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="398" y1="140" x2="398" y2="154" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="391" y1="147" x2="405" y2="147" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
