function recordReview(deckId){
  var nav=loadTodayLog(); var logDb=nav.logDb; var today=nav.today; var log=nav.todayLog;
  var now=Date.now();
  if(log.lastTimestamp&&(now-log.lastTimestamp)<30*60*1000) log.totalSeconds+=(now-log.lastTimestamp)/1000;
  log.lastTimestamp=now; log.cardCount+=1;

     zaehlt fuer HEUTE immer das gerade aktuelle Ziel (wird bei jeder
     weiteren Karte neu gestempelt), waehrend bereits vergangene Tage
     spaeter nicht rueckwirkend durch eine Ziel-Aenderung veraendert
     werden. */
  log.goalAtTime=((loadStore().settings||{}).dailyGoal)||30;

function getLogDb(){ try{ var all=localStorage.getItem(LEARN_LOG_KEY); return all?JSON.parse(all):{}; }catch(e){ return {}; } }
var _lastStreakDbgLine=null;
function calcStreak(){
  var logDb=getLogDb();
  var curGoal=((loadStore().settings||{}).dailyGoal)||30;
  var resetDate=localStorage.getItem(STREAK_RESET_KEY)||null;
  var todayKey=todayStr();
  function metGoal(key){
    var dayLog=logDb[key];
    if(!dayLog||!dayLog.cardCount) return false;
    // Jeder Tag bleibt beim Ziel stehen, das beim letzten Lernen an DIESEM
    // Tag tatsaechlich galt (goalAtTime wird bei jeder Karte neu gestempelt).
    // Das gilt auch fuer heute: setzt man das Ziel nach dem Lernen hoch,
    // bleibt der bereits geschaffte Tag gueltig - die hoehere Zahl greift
    // erst fuer Karten, die man DANACH noch lernt (stempelt goalAtTime neu)
    // bzw. spaetestens ab morgen.
    var goal=dayLog.goalAtTime!==undefined?dayLog.goalAtTime:curGoal;
    return dayLog.cardCount>=goal;
  }
  var d=new Date();
  // Wenn heute das Ziel noch nicht erreicht wurde, zählt der Streak trotzdem noch (bis Mitternacht) – starte bei gestern.
  if(!metGoal(todayKey)) d.setDate(d.getDate()-1);
  var streak=0;
  while(true){
    var key=d.toISOString().slice(0,10);
    if(resetDate&&key<=resetDate) break;
    if(metGoal(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  /* Diagnose fuer den "streak zeigt 0, obwohl ich gestern gelernt habe"-
     Report: zeigt die letzten 3 Tage im Log plus resetDate/curGoal, damit
     sich ein falsches Ergebnis direkt an den Rohdaten nachvollziehen laesst. */
  try{
    var dbgDays=[0,1,2].map(function(off){
      var dd=new Date(); dd.setDate(dd.getDate()-off);
      var k=dd.toISOString().slice(0,10);
      var l=logDb[k];
      return k+':'+(l?('cards='+l.cardCount+' goalAtTime='+l.goalAtTime):'kein Eintrag');
    }).join(' | ');
    var dbgLine='calcStreak: curGoal='+curGoal+' resetDate='+resetDate+' todayKey='+todayKey+' -> streak='+streak+' || '+dbgDays;
    /* calcStreak() wird bei jedem Render von App()/ProfilView() neu
       aufgerufen (nicht memoized) - ungefiltertes dbg() hier hat den
       60-Zeilen-Debug-Log geflutet und andere Fehler (z.B. Drive-
       Verbindungsfehler) binnen Sekunden aus dem Puffer verdraengt.
       Nur bei tatsaechlicher Aenderung loggen. */
    if(dbgLine!==_lastStreakDbgLine){ _lastStreakDbgLine=dbgLine; dbg(dbgLine); }
  }catch(e){}
  return streak;
}

}

function deckPct(deck){
  var cards=deck.cards||[];
  if(cards.length===0)return 0;
  /* roundPending zaehlt bewusst mit: die Karte wurde in der laufenden
     Runde schon durchgearbeitet (nur eben nicht gewusst) - der Balken
     soll zeigen, wie weit man durch den Stapel durch ist, nicht nur
     wie viele Karten wirklich gemeistert sind. Faellt zurueck auf 0,
     sobald die Runde komplett ist und roundPending wieder geloescht

  function checkSelectionForField(id){

        /* Der Cursor ist gerade zu einer reinen Position kollabiert (keine
           Markierung mehr) - eine evtl. noch gemerkte ALTE Markierung

           naechsten Farbwahl nicht mehr wiederverwendet werden, sonst
           wuerde diese versehentlich erneut angewendet statt die Farbe
           fuer den Cursor zu setzen. */
        if(savedSelRef.current&&savedSelRef.current.id===id){
          savedSelRef.current=null;

      /* Farbanzeige (FARBE-Swatch) an die tatsaechliche Farbe an der
         aktuellen Cursor-/Markierungsposition angleichen - z.B. wenn man
         in bereits gefaerbten Text hineinklickt, statt nur beim expliziten
         Farbwaehlen ueber das Swatch selbst. */

  function setTextColor(hex){

    if(saved&&saved.id===selected&&node){
      pushHistory();
      node.focus();
      var sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(saved.range);
      try{
        document.execCommand("styleWithCSS",false,true);
        document.execCommand("foreColor",false,hex);
      }catch(err){}
      var liveSel=window.getSelection();
      if(liveSel&&liveSel.rangeCount>0&&!liveSel.isCollapsed){
        savedSelRef.current={id:selected,range:liveSel.getRangeAt(0).cloneRange()};
      }
      updateElement(selected,{text:node.innerText,html:node.innerHTML},true);
      return;

       Text nach dem Tippen). Ohne echte Selektion faerbt execCommand

function UsernamePickerModal(p){
  var iv=useState(''); var input=iv[0]; var setInput=iv[1];
  var sv=useState(null); var status=sv[0]; var setStatus=sv[1];
  var dtRef=useRef(null);
  function checkAvailability(val){
    val=val.trim();
    if(!val||val.length<3){setStatus(val.length>0?'invalid':null);return;}
    if(!/^[a-zA-Z0-9_\-äöüÄÖÜß]+$/.test(val)){setStatus('invalid');return;}
    setStatus('checking');
    clearTimeout(dtRef.current);
    dtRef.current=setTimeout(function(){
      getSb().rpc('ls_lookup_id_by_username',{p_username:val}).then(function(res){
        setStatus(res.data?'taken':'available');
      }).catch(function(){setStatus(null);});
    },400);
  }
  function handleInput(e){var val=e.target.value;setInput(val);checkAvailability(val);}
  function handleSave(){
    if(status!=='available')return;
    var val=input.trim();
    var myId=localStorage.getItem('kkm-ls-id');
    function finish(){_unCache[myId]=val;saveSocialUsername(val);p.onDone(val);}
    getSb().from('ls_users')
      .upsert({ls_id:myId,username:val},{onConflict:'ls_id',ignoreDuplicates:false})
      .then(function(r){
        if(r.error){
          if(r.error.code==='23505'){setStatus('taken');return;}
          dbg('❌ Username upsert Fehler:',r.error.message||r.error);
          finish();return;
        }
        finish();
      }).catch(function(e){dbg('❌ Username upsert catch:',e);finish();});
  }
  var statusEl=null;
  if(status==='checking')statusEl=h('span',{style:{color:'#aaa'}},'⏳ Prüfe…');
  else if(status==='available')statusEl=h('span',{style:{color:'#4caf50'}},'✅ Verfügbar!');
  else if(status==='taken')statusEl=h('span',{style:{color:'#f44336'}},'❌ Bereits vergeben');
  else if(status==='invalid')statusEl=h('span',{style:{color:'#ff9800'}},'Mindestens 3 Zeichen, nur Buchstaben/Zahlen/_/-');
  return h('div',{className:'lp-modal-ov',style:{zIndex:10000}},
    h('div',{className:'lp-modal-box'},
      h('div',{className:'lp-modal-title'},'Benutzername wählen'),
      h('div',{className:'lp-modal-sub',style:{marginBottom:16}},'Dein öffentlicher Name im Netzwerk. Einzigartig und nicht mehr änderbar.'),
      h('input',{type:'text',className:'lp-dark-input',placeholder:'z. B. LernProfi42',value:input,onInput:handleInput,autoFocus:true,
        onKeyDown:function(e){if(e.key==='Enter'&&status==='available')handleSave();}}),
      h('div',{style:{minHeight:24,fontSize:13}},statusEl),
      h('div',{className:'lp-modal-actions'},
        h(DsButton,{variant:'primary',style:{width:'auto',padding:'0 24px',height:40,opacity:status==='available'?1:0.5},onClick:handleSave,disabled:status!=='available'},h('span',{className:'lp-btn-glow-label'},'Speichern')))));
}

function buildLernEmpfehlungen(data){
  var settings=data.settings||{lernTage:7,lernArten:['Klausur','Test']};
  var lernTage=settings.lernTage||7;
  var lernArten=settings.lernArten||['Klausur','Test'];
  var today=new Date(); today.setHours(0,0,0,0);
  var maxDate=new Date(today); maxDate.setDate(maxDate.getDate()+lernTage);
  var result=[];
  (data.arbeiten||[]).forEach(function(a){
    if(!lernArten.includes(a.type)) return;
    if(!a.fachId) return;
    var d=new Date(a.date+'T00:00:00'); d.setHours(0,0,0,0);
    if(d<today||d>maxDate) return;
    var fachDecks=(data.decks||[]).filter(function(dk){return dk.folderId===a.fachId;});
    if(!fachDecks.length) return;
    var fach=(data.folders||[]).find(function(f){return f.id===a.fachId;});
    var days=Math.ceil((d-today)/(1000*60*60*24));
    result.push({arbeit:a,fach:fach,decks:fachDecks,daysUntil:days});
  });
  result.sort(function(a,b){return a.daysUntil-b.daysUntil;});
  return result.slice(0,3);
}

/* Race eine (Supabase-)Promise gegen ein Zeitlimit, damit ein
   haengender oder pausierter Server nicht 30+ Sekunden blockiert,
   sondern nach spaetestens `ms` als Fehler durchschlaegt. Bricht die
   eigentliche Anfrage nicht ab, laesst aber aufrufenden Code nicht
   haengen. */
function withTimeout(promiseLike,ms){
  return Promise.race([
    Promise.resolve(promiseLike),
    new Promise(function(_,reject){setTimeout(function(){reject(new Error('Zeitüberschreitung nach '+ms+'ms'));},ms);})
  ]);
}
function lsGet(col,docId){
  if(col==='ls_users'){
    dbg('lsGet ls_users:',docId);
    return withTimeout(getSb().from('ls_users').select('netzwerk_data').eq('ls_id',docId).limit(1),12000)
      .then(function(res){
        if(res.error){dbg('❌ lsGet error:',res.error.message||res.error);throw res.error;}
        var row=(res.data&&res.data.length)?res.data[0]:null;
        dbg('✅ lsGet ok. Daten vorhanden:',!!row);
        return row?row.netzwerk_data:null;
      });
  }
  if(col==='ls_groups'){
    dbg('lsGet ls_groups:',docId);
    return withTimeout(getSb().from('ls_groups').select('*').eq('id',docId).limit(1),12000)
      .then(function(res){
        if(res.error){dbg('❌ lsGet groups error:',res.error.message||res.error);throw res.error;}
        var row=(res.data&&res.data.length)?res.data[0]:null;
        dbg('✅ lsGet groups ok. Vorhanden:',!!row);
        if(!row)return null;
        return {
          id:row.id,name:row.name,emoji:row.emoji,
          avatar:row.avatar,members:row.members||[],
          groupDecks:row.group_decks||[],
          created:row.created?Number(row.created):null,
          createdBy:row.created_by,deckIds:[]
        };
      });
  }
  return Promise.resolve(null);
}
function lsSet(col,docId,data){
  if(col==='ls_users'){
    dbg('lsSet ls_users:',docId);
    return getSb().from('ls_users')
      .upsert({ls_id:docId,netzwerk_data:data,updated_at:new Date().toISOString()},{onConflict:'ls_id'})
      .then(function(res){
        if(res.error){dbg('❌ lsSet users error:',res.error.message||res.error);throw res.error;}
        dbg('✅ lsSet users ok');
        return res;
      });
  }
  if(col==='ls_groups'){
    dbg('lsSet ls_groups:',docId);
    return getSb().from('ls_groups')
      .upsert({
        id:docId,name:data.name,emoji:data.emoji||null,
        members:data.members||[],group_decks:data.groupDecks||[],
        created:data.created?String(data.created):null,
        created_by:data.createdBy||null,
        updated_at:new Date().toISOString()
      },{onConflict:'id'})
      .then(function(res){
        if(res.error){dbg('❌ lsSet groups error:',res.error.message||res.error);throw res.error;}
        dbg('✅ lsSet groups ok');
        return res;
      });
  }
  return Promise.resolve();
}
function copyDeckNewIds(deck){
  var newDeck=Object.assign({},deck,{id:uid()});
  newDeck.cards=(deck.cards||[]).map(function(c){return Object.assign({},c,{id:uid(),lvl:0,nextReview:null});});
  if(newDeck.folders)(newDeck.folders||[]).map(function(f){return Object.assign({},f,{id:uid()});});
  return newDeck;
}

// Mitglieder-Helper: unterstützt altes String-Format UND neues {id,role}-Format
function normalizeMembers(members){
  return (members||[]).map(function(m,i){
    if(m&&typeof m==='object')return {id:m.id,role:m.role||'user'};
    return {id:m,role:i===0?'admin':'user'};
  });
}
function memberRole(members,id){
  var nm=normalizeMembers(members);
  for(var i=0;i<nm.length;i++){if(nm[i].id===id)return nm[i].role;}
  return null;
}
function isGroupAdmin(g,id){return memberRole(g&&g.members,id)==='admin';}

function CropperView(p){
  var CSIZE=220;
  var posS=useState({x:0,y:0});var pos=posS[0];var setPos=posS[1];
  var scS=useState(1);var sc=scS[0];var setSc=scS[1];
  var imgRef=useRef(null);
  var dragging=useRef(false);
  var lastXY=useRef({x:0,y:0});
  var lastPinch=useRef(0);
  var minSc=useRef(1);
  var hRef=useRef({});
  hRef.current.onTM=function(e){
    if(e.touches.length===1&&dragging.current){
      var dx=e.touches[0].clientX-lastXY.current.x;
      var dy=e.touches[0].clientY-lastXY.current.y;
      lastXY.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
      setPos(function(pp){return{x:pp.x+dx,y:pp.y+dy};});
    }else if(e.touches.length===2&&lastPinch.current>0){
      var dx2=e.touches[0].clientX-e.touches[1].clientX;
      var dy2=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx2*dx2+dy2*dy2);
      var ratio=dist/lastPinch.current;
      lastPinch.current=dist;
      setSc(function(s){return Math.max(minSc.current,Math.min(5,s*ratio));});
    }
  };
  hRef.current.onTS=function(e){
    if(e.touches.length===1){
      dragging.current=true;
      lastXY.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
      lastPinch.current=0;
    }else if(e.touches.length===2){
      dragging.current=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      lastPinch.current=Math.sqrt(dx*dx+dy*dy);
    }
  };
  var contRef=useRef(null);
  useEffect(function(){
    var el=contRef.current;
    if(!el)return;
    var opts={passive:false};
    function onTM(e){e.preventDefault();hRef.current.onTM(e);}
    function onTS(e){e.preventDefault();hRef.current.onTS(e);}
    el.addEventListener('touchmove',onTM,opts);
    el.addEventListener('touchstart',onTS,opts);
    return function(){el.removeEventListener('touchmove',onTM,opts);el.removeEventListener('touchstart',onTS,opts);};
  },[]);
  function onLoad(e){
    var img=e.target;
    var ms=Math.max(CSIZE/img.naturalWidth,CSIZE/img.naturalHeight);
    minSc.current=ms;setSc(ms);setPos({x:0,y:0});
  }
  function onMouseDown(e){dragging.current=true;lastXY.current={x:e.clientX,y:e.clientY};}
  function onMouseMove(e){if(!dragging.current)return;var dx=e.clientX-lastXY.current.x;var dy=e.clientY-lastXY.current.y;lastXY.current={x:e.clientX,y:e.clientY};setPos(function(pp){return{x:pp.x+dx,y:pp.y+dy};});}
  function onMouseUp(){dragging.current=false;}
  function confirmCrop(){
    var img=imgRef.current;
    if(!img||!img.naturalWidth)return;
    var canvas=document.createElement('canvas');
    canvas.width=canvas.height=200;
    var ctx=canvas.getContext('2d');
    var srcSize=CSIZE/sc;
    var srcX=(img.naturalWidth/2)-(pos.x/sc)-(srcSize/2);
    var srcY=(img.naturalHeight/2)-(pos.y/sc)-(srcSize/2);
    ctx.drawImage(img,srcX,srcY,srcSize,srcSize,0,0,200,200);
    p.onConfirm(canvas.toDataURL('image/jpeg',0.75));
  }
  return h('div',null,
    h('div',{ref:contRef,className:'av-cropper-ring',
      onMouseDown:onMouseDown,onMouseMove:onMouseMove,onMouseUp:onMouseUp,onMouseLeave:onMouseUp},
      h('img',{ref:imgRef,src:p.imgSrc,onLoad:onLoad,draggable:false,
        style:{position:'absolute',top:'50%',left:'50%',maxWidth:'none',pointerEvents:'none',
          transform:'translate(calc(-50% + '+pos.x+'px), calc(-50% + '+pos.y+'px)) scale('+sc+')',
          transformOrigin:'center'}})
    ),
    h('div',{className:'av-cropper-hint'},'\u2194\ufe0f Verschieben  \u2022  Pinch zum Zoomen'),
    h('div',{style:{display:'flex',gap:12}},
      h(DsButton,{variant:'ghost',style:{flex:1},onClick:p.onCancel},'Zur\u00fcck'),
      h(DsButton,{variant:'primary',style:{flex:1},onClick:confirmCrop},h('span',{className:'lp-btn-glow-label'},'\u2713 Zuschneiden'))
    )
  );
}

    var ch=getSb().channel('group-rt-'+gid)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ls_groups',filter:'id=eq.'+gid},
        function(payload){

          dbg('RT: update received for group '+gid);

            return Object.assign({},prev,{groups:(prev.groups||[]).map(function(g){return g.id===gid?updG:g;})});

        function(payload){

  function loadGroups(groupsArg){
    if(savingRef.current||loadingGroupsRef.current)return;
    var myGroups=groupsArg||(lsData&&lsData.groups)||[];
    if(!myGroups.length){dbg('loadGroups: keine Gruppen');return;}
    loadingGroupsRef.current=true;
    dbg('loadGroups: '+myGroups.length+' Gruppe(n)');
    Promise.all(myGroups.map(function(g){
      return lsGet('ls_groups',g.id).catch(function(){return null;});
    })).then(function(fresh){
      loadingGroupsRef.current=false;
      if(savingRef.current)return;
      var changed=false;
      var merged=myGroups.map(function(g,i){
        if(fresh[i]&&JSON.stringify(fresh[i])!==JSON.stringify(g)){changed=true;return fresh[i];}
        return g;
      });
      if(changed){dbg('loadGroups: aktualisiert');setLsData(function(prev){return Object.assign({},prev,{groups:merged});});}
      else{dbg('loadGroups: keine Änderung');}
    }).catch(function(){loadingGroupsRef.current=false;});
  }

  /* WICHTIG: merged wird aus remote + NUR den in d explizit uebergebenen
     Feldern gebaut (Object.assign({},remote,d)) - NICHT aus dem gesamten
     lokalen lsData (local). Grund: lsData im React-State kann zum
     Zeitpunkt des Aufrufs veraltete Felder enthalten (z.B. groups, wenn
     parallel ein anderer Sync-Call noch laeuft/nachzieht). Ein Object.assign
     mit dem KOMPLETTEN lsData ueberschreibt dann serverseitig auch Felder,
     die dieser Aufruf gar nicht aendern wollte, mit dem veralteten lokalen
     Stand - genau das hat einmal live eine komplette Gruppen-Mitgliedschaft
     kommentarlos geloescht (kein Fehler, kein Log, einfach weg). friends/
     requests sind zusaetzlich per Vereinigung abgesichert (rein additiv,
     kann daher nie etwas verlieren); alle anderen Felder (u.a. groups,
     groupInvites) bleiben jetzt unangetastet, wenn sie nicht Teil von d sind. */
  function saveData(d){
    var local=Object.assign({},lsData,d);
    setLsData(local);
    savingRef.current=true;
    return lsGet('ls_users',MY_ID).then(function(remote){
      remote=remote||defaultData;
      var merged=Object.assign({},remote,d);
      var rReqs=remote.requests||[];var lReqs=local.requests||[];var allReqs=rReqs.slice();
      lReqs.forEach(function(r){if(!allReqs.find(function(x){return x.fromId===r.fromId;}))allReqs.push(r);});
      merged.requests=allReqs;
      var rFr=remote.friends||[];var lFr=local.friends||[];var allFr=rFr.slice();
      lFr.forEach(function(f){if(!allFr.find(function(x){return x.id===f.id;}))allFr.push(f);});
      merged.friends=allFr;
      return lsSet('ls_users',MY_ID,merged).then(function(){
        savingRef.current=false;setLsData(merged);return merged;
      });
    }).catch(function(){savingRef.current=false;showToast('Sync-Fehler');});
  }
  function saveDataAccept(d,acceptedFromId){
    var local=Object.assign({},lsData,d);setLsData(local);savingRef.current=true;
    return lsGet('ls_users',MY_ID).then(function(remote){
      remote=remote||defaultData;var merged=Object.assign({},remote,d);
      var rReqs=remote.requests||[];var lReqs=local.requests||[];var allReqs=rReqs.slice();
      lReqs.forEach(function(r){if(!allReqs.find(function(x){return x.fromId===r.fromId;}))allReqs.push(r);});
      merged.requests=allReqs.filter(function(r){return r.fromId!==acceptedFromId;});
      var rFr=remote.friends||[];var lFr=local.friends||[];var allFr=rFr.slice();
      lFr.forEach(function(f){if(!allFr.find(function(x){return x.id===f.id;}))allFr.push(f);});
      merged.friends=allFr;
      return lsSet('ls_users',MY_ID,merged).then(function(){
        savingRef.current=false;setLsData(merged);return merged;
      });
    }).catch(function(){savingRef.current=false;showToast('Sync-Fehler');});
  }

  function sendFriendRequest(){
    var raw=inviteId.trim();
    if(!raw){showToast('Ung\u00fcltige ID');return;}
    function doSend(tid){
      if(tid===MY_ID){showToast('Das bist du selbst \uD83D\uDE05');return;}
      var curFriends=(lsData&&lsData.friends)||[];
      var curSent=(lsData&&lsData.sentRequests)||[];
      if(curFriends.find(function(f){return f.id===tid;})){showToast('Bereits befreundet');return;}
      if(curSent.find(function(r){return r.toId===tid;})){showToast('Anfrage bereits gesendet');return;}
      getSb().rpc('ls_send_friend_request',{p_target_ls_id:tid}).then(function(res){
        if(res.error){showToast('Nutzer nicht gefunden');return;}
        var newSent=[].concat((lsData&&lsData.sentRequests)||[],[{toId:tid,ts:Date.now()}]);
        saveData({sentRequests:newSent});
        showToast('Anfrage gesendet!');
        setInviteId('');setInviteHints([]);
      }).catch(function(){showToast('Fehler beim Senden');});
    }
    var uname=raw.startsWith('@')?raw.slice(1):raw;
    getSb().rpc('ls_lookup_id_by_username',{p_username:uname})
    .then(function(res){
      doSend(res.data||uname);
    }).catch(function(){doSend(uname);});
  }

  function createGroup(){
    if(!groupName.trim()){showToast('Name eingeben');return;}
    var gid=uid();
    var g={id:gid,name:groupName.trim(),emoji:groupEmoji,members:[{id:MY_ID,role:'admin'}],deckIds:[],created:Date.now()};
    var newGroups=[].concat(lsData.groups||[],[g]);
    saveData({groups:newGroups});
    setGroupName('');
    showToast('Gruppe erstellt!');
    /* RPC statt Direkt-Insert: Postgres wendet bei INSERT...RETURNING
       zusaetzlich die SELECT-Policy auf die neue Zeile an (dokumentiertes
       RLS-Verhalten) - is_ls_group_member() sieht die eigene, gerade erst
       eingefuegte Zeile innerhalb desselben RETURNING-Checks aber nicht,
       wodurch selbst ein reines insert() (mit Repraesentation, wie es der
       Supabase-Client standardmaessig anfordert) faelschlich an der
       Select-Policy scheitert. Die SECURITY DEFINER-Funktion umgeht RLS
       komplett, exakt wie ls_claim_own_id und alle anderen Cross-Row-Writes. */
    getSb().rpc('ls_create_group',{p_id:gid,p_name:g.name,p_emoji:g.emoji||null,p_created:String(g.created)}).then(function(){},function(){});
  }

  /* Frueher ein roher Client-Upsert der KOMPLETTEN Gruppen-Zeile (inkl.
     Mitgliederliste!) bei jeder Stapel-/Karten-Aenderung - schrieb dabei
     einen moeglicherweise veralteten lokalen Snapshot zurueck. Bearbeiten
     zwei Mitglieder gleichzeitig denselben geteilten Stapel (der Kern-
     Anwendungsfall von "geteilte Stapel"), ueberschreibt der zweite
     Speichervorgang die Aenderung des ersten stillschweigend - und zwar
     nicht nur am Stapel, sondern potenziell auch an der Mitgliederliste.
     Jetzt: atomare RPC ls_group_deck_upsert, die serverseitig nur den
     betroffenen Stapel per id ersetzt - andere Stapel und Mitglieder
     bleiben unberuehrt, egal was lokal sonst noch im State steht. */
  function applyGroupUpdate(updG,changedDeck){
    setSelectedGroup(updG);
    var newGroups=(lsData.groups||[]).map(function(gr){return gr.id===updG.id?updG:gr;});
    if(!newGroups.find(function(gr){return gr.id===updG.id;}))newGroups=newGroups.concat([updG]);
    saveData({groups:newGroups});
    return getSb().rpc('ls_group_deck_upsert',{p_group_id:updG.id,p_deck:changedDeck}).then(function(res){
      if(res.error)throw res.error;
    });
  }

  function inviteMember(){
    var raw=inviteMemberId.trim();
    var g=selectedGroup;
    if(!g)return;
    if(!isGroupAdmin(g,MY_ID)){showToast('Nur Admins d\u00fcrfen einladen');return;}
    if(!raw){showToast('ID oder Benutzername eingeben');return;}
    function doInvite(tid){
      if(tid===MY_ID){showToast('Das bist du selbst');return;}
      var nm=normalizeMembers(g.members);
      if(nm.find(function(m){return m.id===tid;})){showToast('Bereits Mitglied');return;}
      if((lsData.groupInvites||[]).find(function(x){return x.id===g.id&&x.toId===tid;})){showToast('Einladung bereits gesendet');return;}
      dbg('invite: starte \u2709 '+tid+' \u2192 Gruppe '+g.id);
      getSb().rpc('ls_invite_group_member',{p_target_ls_id:tid,p_group_id:g.id,p_group_name:g.name,p_group_emoji:g.emoji||'\ud83c\udfeb',p_role:inviteRole}).then(function(res){
        if(res.error){dbg('invite: \u274c',res.error.message);showToast('Benutzer nicht gefunden oder keine Berechtigung');return;}
        dbg('invite: \u2705 Einladung gesendet an '+tid);
        showToast('Einladung gesendet!');
        setInviteMemberId('');setInviteRole('user');setMemberHints([]);
      }).catch(function(e){dbg('invite: \u274c',e&&(e.message||JSON.stringify(e)));showToast('Fehler beim Einladen');});
    }
    var uname=raw.startsWith('@')?raw.slice(1):raw;
    getSb().rpc('ls_lookup_id_by_username',{p_username:uname})
    .then(function(res){
      doInvite(res.data||uname);
    }).catch(function(){doInvite(uname);});

  /* Wie saveDataRemoveShared: groupInvites/groups werden erst NACH lsGet()
     anhand von remote gefiltert bzw. ergaenzt, nicht anhand des moeglicherweise
     veralteten lokalen lsData - sonst koennte eine zwischen Laden und Annehmen/
     Ablehnen frisch eingetroffene zweite Einladung stillschweigend verschwinden. */
  function acceptGroupInvite(invite){
    dbg('acceptGroupInvite:',invite.id);
    var groupEntry={id:invite.id,name:invite.name,emoji:invite.emoji,members:[],groupDecks:[],deckIds:[],created:invite.ts};
    setLsData(function(prev){
      var newInvites=(prev.groupInvites||[]).filter(function(x){return x.id!==invite.id;});
      var newGroups=(prev.groups||[]).filter(function(g){return g.id!==invite.id;}).concat([groupEntry]);
      return Object.assign({},prev,{groupInvites:newInvites,groups:newGroups});
    });
    savingRef.current=true;
    lsGet('ls_users',MY_ID).then(function(remote){
      remote=remote||defaultData;
      var merged=Object.assign({},remote);
      merged.groupInvites=(remote.groupInvites||[]).filter(function(x){return x.id!==invite.id;});
      merged.groups=(remote.groups||[]).filter(function(g){return g.id!==invite.id;}).concat([groupEntry]);
      return lsSet('ls_users',MY_ID,merged).then(function(){
        savingRef.current=false;setLsData(merged);
      });
    }).catch(function(){savingRef.current=false;showToast('Sync-Fehler');});
    getSb().rpc('ls_accept_group_invite',{p_group_id:invite.id,p_role:invite.role||'user'}).then(function(res){
      if(res.error){dbg('acceptGroupInvite: \u274c',res.error.message);showToast('Fehler beim Beitreten');return;}
      dbg('acceptGroupInvite: \u2705 beigetreten');
      showToast('Gruppe beigetreten!');
    }).catch(function(e){dbg('acceptGroupInvite: \u274c',e&&e.message);showToast('Fehler beim Beitreten');});
  }

  function declineGroupInvite(invite){

    lsGet('ls_users',MY_ID).then(function(remote){
      remote=remote||defaultData;

  /* Native confirm() statt eines eigenen Modals fuehrte in installierten
     PWAs (Standalone-Modus, insb. iOS) dazu, dass der Dialog gar nicht erst
     erschien und die Funktion sofort und unbemerkt (kein Toast, kein
     dbg()-Log - konnte bisher nirgends nachvollzogen werden) beim
     !confirm(...)-Abbruch zurueckkehrte. Jetzt ein eigenes Modal
     (GroupActionConfirmModal, gleiches Muster wie DeleteAccountConfirmModal)
     plus durchgehendes dbg()-Logging wie beim Einladen-Flow. */
  function deleteOrTransferGroup(){
    var g=selectedGroup;
    if(!g)return;
    var tid=transferTarget.trim();
    if(tid){
      var members=normalizeMembers(g.members);
      if(!members.find(function(m){return m.id===tid;})){showToast('Kein Mitglied der Gruppe');return;}
      setGroupActionConfirm({type:'transfer',tid:tid});
    } else {
      setGroupActionConfirm({type:'delete'});
    }
  }
  function runTransferGroup(tid){
    var g=selectedGroup;
    if(!g)return;
    var members=normalizeMembers(g.members);
    dbg('transferGroup: starte \u2192 '+tid);
    getSb().rpc('ls_group_transfer',{p_group_id:g.id,p_target_ls_id:tid}).then(function(res){
      if(res.error){dbg('transferGroup: \u274c',res.error.message);showToast('Fehler');return;}
      dbg('transferGroup: \u2705');
      var newMembers=members.map(function(m){
        if(m.id===tid&&m.role!=='admin')return Object.assign({},m,{role:'admin'});
        if(m.id===MY_ID)return Object.assign({},m,{role:'user'});
        return m;
      });
      var updG=Object.assign({},g,{members:newMembers,createdBy:tid});
      setSelectedGroup(updG);
      var newGroups=(lsData.groups||[]).map(function(gr){return gr.id===updG.id?updG:gr;});

  function renderGroupDetail(){
    var g=selectedGroup;
    if(!g)return null;
    var members=g.members||[];
    var groupDecks=g.groupDecks||[];
    var gid=g.id;
    var msgs=groupChats[gid]||[];
    var isAdmin=isGroupAdmin(g,MY_ID);

    /* Frueher ein direkter Client-Upsert der kompletten Mitgliederliste
       (lsSet('ls_groups',...)) plus natives confirm() - gleiche zwei
       Bug-Klassen wie beim Loeschen/Uebertragen: confirm() kann in einer
       installierten PWA (Standalone-Modus) ausbleiben, und ein aus dem
       lokalen, moeglicherweise veralteten g.members gefiltertes Array
       ueberschreibt beim Zurueckschreiben die serverseitige Mitgliederliste
       komplett - inkl. zwischenzeitlicher Aenderungen anderer Mitglieder.
       Jetzt: eigenes Modal + SECURITY DEFINER RPC (atomar, wie alle anderen
       Cross-Row-Writes), inkl. serverseitig durchgesetzter "einziger Admin
       muss zuerst uebertragen/loeschen"-Regel (der Client-Check bleibt als
       schnelles Feedback, ist aber nicht mehr die einzige Absicherung). */
    function leaveGroup(){
      if(isAdmin){
        var otherAdmins=normalizeMembers(g.members).filter(function(m){return m.id!==MY_ID&&m.role==='admin';});
        if(!otherAdmins.length&&normalizeMembers(g.members).length>1){
          showToast('Als einziger Admin zuerst Gruppe \u00fcbertragen oder l\u00f6schen');return;
        }
      }
      setGroupActionConfirm({type:'leave'});
    }

    function sendMsg(){
      var txt=chatInput.trim();
      if(!txt)return;
      var ts=Date.now();
      var m={who:MY_ID,text:txt,ts:ts,mine:true};
      setGroupChats(function(prev){var u=Object.assign({},prev);u[gid]=(prev[gid]||[]).concat([m]);return u;});
      setChatInput('');
      getSb().from('ls_messages').insert({group_id:gid,from_id:MY_ID,text:txt})
      .then(function(res){if(res.error){dbg('chat send error:',res.error.message);showToast('Fehler beim Senden');}})
      .catch(function(){showToast('Fehler beim Senden');});
    }
    return h('div',{style:{position:'relative',zIndex:2}},
      h('div',{className:'ls-gd-hero'},
        isAdmin&&h('button',{className:'ls-gd-menu-btn',onClick:function(){setShowGroupSettings(true);},title:'Admin-Einstellungen'},'\u22EE'),
        h('div',{className:'ls-gd-av-wrap',onClick:function(){setShowGroupAvPicker(true);}},
          g.avatarPhoto
            ?h('img',{src:g.avatarPhoto,style:{width:'68px',height:'68px',borderRadius:'50%',objectFit:'cover',border:'1px solid rgba(124,58,237,.55)',display:'block',boxShadow:'0 0 14px rgba(124,58,237,.45),0 0 6px rgba(6,182,212,.3)'}})
            :h('div',{className:'ls-gd-av round'},h('span',{className:'lp-avatar-tile-label',style:{fontSize:'28px'}},(g.name||'?').charAt(0).toUpperCase())),
          h('div',{className:'ls-gd-av-cam'},'\ud83d\udcf7')
        ),
        h('div',{className:'ls-gd-name'},g.name),
        h('div',{className:'ls-gd-meta'},'Erstellt '+(new Date(g.created||Date.now()).toLocaleDateString('de-DE'))),
        h('div',{className:'ls-gd-stats'},
          h('div',{className:'ls-gd-stat'},h('span',{className:'ls-gd-stat-n'},members.length),h('span',{className:'ls-gd-stat-l'},'Mitglieder')),
          h('div',{className:'ls-gd-stat'},h('span',{className:'ls-gd-stat-n'},(g.groupDecks||[]).length),h('span',{className:'ls-gd-stat-l'},'Stapel')),
          h('div',{className:'ls-gd-stat'},h('span',{className:'ls-gd-stat-n'},msgs.length),h('span',{className:'ls-gd-stat-l'},'Nachrichten'))
        ),
        h('button',{className:'ls-gd-leave-btn',onClick:leaveGroup},'\uD83D\uDEAA Gruppe verlassen'),
        h('div',{className:'ls-gd-tabs'},
          h('button',{className:'ls-gd-tab'+(groupTab==='members'?' active':''),onClick:function(){setGroupTab('members');}},'👥 Mitglieder'),
          h('button',{className:'ls-gd-tab'+(groupTab==='stacks'?' active':''),onClick:function(){setGroupTab('stacks');}},'\uD83D\uDCDA Stapel'),
          h('button',{className:'ls-gd-tab'+(groupTab==='chat'?' active':''),onClick:function(){setGroupTab('chat');}},'\uD83D\uDCAC Chat')
        )
      ),
      groupTab==='members'&&h('div',{className:'ls-gd-content'},
        h('div',{className:'ls-sec-lbl'},'\ud83d\udc65 Mitglieder ('+members.length+')'),
        normalizeMembers(members).map(function(m,i){
          var mid=m.id;
          return h('div',{key:i,className:'ls-gd-member'},
            h('div',{className:'ls-gd-mav'},mid===MY_ID?'\ud83e\uddd1\u200d\ud83d\udcbb':['\ud83d\udc69\u200d\ud83c\udf93','\ud83e\udd8a','\ud83d\udc09','\u2b50','\ud83c\udf19','\ud83e\udd8b'][i%6]),
            h('div',null,
              h('div',{className:'ls-gd-mname'},mid===MY_ID?'Du ('+MY_ID+')':mid),
              h('div',{className:'ls-gd-mrole'},m.role==='admin'?'Admin':'Mitglied')
            ),
            m.role==='admin'&&h('div',{className:'ls-gd-mbadge'},'ADMIN')
          );
        })
      ),
      groupTab==='stacks'&&h('div',{className:'ls-gd-content'},renderGroupStacks(g,gid)),
      groupTab==='chat'&&h('div',{className:'ls-gd-content'},
        chatLoading
          ?h('div',{className:'ls-gd-empty'},'\u23F3 Nachrichten werden geladen\u2026')
          :msgs.length===0
            ?h('div',{className:'ls-gd-empty'},'\ud83d\udcac Noch keine Nachrichten \u2013 starte die Unterhaltung!')
            :h('div',{className:'ls-gd-chat-wrap'},
                msgs.map(function(m,i){
                  var t=new Date(m.ts);
                  var tStr=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
                  return h('div',{key:i,className:'ls-gd-chat-msg'+(m.mine?' mine':'')},
                    !m.mine&&h('div',{className:'ls-gd-chat-who'},m.who),
                    h('div',{className:'ls-gd-bubble'+(m.mine?' mine':'')},
                      h('div',{className:'ls-gd-chat-text'},m.text)
                    ),
                    h('div',{className:'ls-gd-chat-time'},tStr)
                  );
                }),
                h('div',{ref:chatEndRef})
              ),
        h('div',{className:'ls-gd-chat-inp'},
          h('input',{className:'ls-gd-chat-input',placeholder:'Nachricht schreiben\u2026',value:chatInput,
            onInput:function(e){setChatInput(e.target.value);},
            onKeyDown:function(e){if(e.key==='Enter')sendMsg();}}),
          h('button',{className:'ls-gd-send',onClick:sendMsg},'\u27a4')
        )
      )
    );
  }

  var isGroupDetailSub=lsPage==='group-detail'&&groupStackPage!=='list';
  return h('div',null,
    h('div',{style:{display:'flex',flexDirection:'column',gap:24}},
      isGroupDetailSub&&h('button',{className:'back-btn',onClick:function(){setGroupStackPage('list');setGroupTab('stacks');}},'← Zurück'),
      !isGroupDetailSub&&lsPage!=='group-detail'&&h('div',{style:{fontSize:24,fontWeight:700,letterSpacing:'-0.03em',color:'#fff'}},'Netzwerk'),
      !isGroupDetailSub&&lsPage!=='group-detail'&&h('div',{className:'lp-tabbar'},
        [['home','Übersicht'],['friends','Freunde'],['groups','Gruppen'],['shared','Geteilt'],['challenges','Duelle']].map(function(t){
          return h('button',{key:t[0],className:'lp-tab'+(lsPage===t[0]?' active':''),onClick:function(){setLsPage(t[0]);}},t[1]);
        })),
      !isOnline&&h('div',{style:{display:'flex',alignItems:'center',gap:12,background:'rgba(124,58,237,.08)',border:'1px solid rgba(124,58,237,.25)',borderRadius:14,padding:'12px 16px',fontSize:13,color:'rgba(255,255,255,.6)',lineHeight:1.5}},
        h('span',null,'🛰️'),
        h('div',null,

      loading&&lsPage==='home'?h('div',{className:'lp-empty2'},'Lade Netzwerk…')

      :lsPage==='friends'?renderFriends()
      :lsPage==='groups'?renderGroups()

      :lsPage==='shared'?renderShared()
      :renderChallenges()
    ),
    showAvPicker&&h(AvatarPickerModal,{
      current:lsData&&lsData.avatar||'av1',
      currentPhoto:lsData&&lsData.avatarPhoto||null,
      onSave:saveAvatar,
      onClose:function(){setShowAvPicker(false);}
    }),
    showGroupAvPicker&&selectedGroup&&h(GroupAvatarPickerModal,{
      currentPhoto:selectedGroup.avatarPhoto||null,
      onSavePhoto:function(photo){
        var gid=selectedGroup.id;
        var upd=Object.assign({},selectedGroup,{avatar:'photo',avatarPhoto:photo});
        setSelectedGroup(upd);
        var newGroups=(lsData.groups||[]).map(function(g){return g.id===upd.id?upd:g;});
        saveData({groups:newGroups});
        setShowGroupAvPicker(false);
        getSb().rpc('ls_group_set_photo',{p_group_id:gid,p_avatar_photo:photo}).then(function(res){
          if(res.error){showToast('Fehler beim Speichern');return;}
          showToast('Foto gespeichert!');
        }).catch(function(){showToast('Fehler beim Speichern');});
      },
      onClose:function(){setShowGroupAvPicker(false);}
    }),
    showGroupSettings&&selectedGroup&&isGroupAdmin(selectedGroup,MY_ID)&&h('div',{className:'lp-modal-ov',onClick:function(){setShowGroupSettings(false);}},
      h('div',{className:'lp-modal-box',style:{position:'relative'},onClick:function(e){e.stopPropagation();}},
        h('div',null,
          h('div',{className:'lp-modal-title grad'},'Admin-Einstellungen'),
          h('div',{className:'lp-modal-sub'},selectedGroup.name||'Gruppe verwalten')
        ),
        h('button',{className:'lp-modal-close',onClick:function(){setShowGroupSettings(false);}},'\u00D7'),
        h('div',{className:'lp-seclbl'},'Mitglied einladen'),
        h('input',{className:'lp-dark-input',placeholder:'Benutzername',value:inviteMemberId,autoCorrect:'off',autoComplete:'off',autoCapitalize:'none',spellCheck:false,onInput:function(e){var v=e.target.value;setInviteMemberId(v);searchMemberHints(v);}}),
        memberHints.length>0&&h('div',{style:{display:'flex',flexWrap:'wrap',gap:8}},
          memberHints.slice(0,4).map(function(u){return h('button',{key:u,className:'lp-chip',onClick:function(){setInviteMemberId(u);setMemberHints([]);}},u);})
        ),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{className:'lp-mode-chip'+(inviteRole==='user'?' active':''),onClick:function(){setInviteRole('user');}},'Mitglied'),
          h('button',{className:'lp-mode-chip'+(inviteRole==='admin'?' active':''),onClick:function(){setInviteRole('admin');}},'Admin')
        ),
        h(DsButton,{variant:'primary',onClick:inviteMember},h('span',{className:'lp-btn-glow-label'},'Einladen')),
        h('div',{className:'lp-seclbl',style:{marginTop:8}},'Mitglieder verwalten'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          normalizeMembers(selectedGroup.members).map(function(m,i){
            return h('div',{key:i,className:'lp-row'},
              h('div',{style:{flex:1,minWidth:0}},
                h('div',{className:'lp-row-title'},m.id===MY_ID?'Du':h(UserLabel,{id:m.id})),

                h('button',{className:'lp-icon-btn-sm del',title:'Entfernen',onClick:function(){removeMember(m.id);}},
                  h('svg',{width:14,height:14,viewBox:'0 0 14 14',fill:'none',stroke:'currentColor',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
                    h('path',{d:'M2 3.5h10M5.5 3.5V2h3v1.5M3.5 3.5l.6 8.2a1 1 0 001 .8h3.8a1 1 0 001-.8l.6-8.2'})
                  )
                )
              )
            );
          })

        h('div',{style:{marginTop:8,paddingTop:16,borderTop:'1px solid rgba(239,68,68,0.25)',display:'flex',flexDirection:'column',gap:12}},
          h('div',{className:'lp-seclbl',style:{color:'#EF4444'}},'Gruppe l\u00f6schen / \u00fcbertragen'),
          h('div',{style:{fontSize:'13px',color:'rgba(255,255,255,.5)',lineHeight:1.6}},'Lern-Space-ID eingeben um die Gruppe zu \u00fcbertragen. Feld leer lassen um die Gruppe unwiderruflich zu l\u00f6schen.'),
          h('input',{className:'lp-dark-input',placeholder:'ID des neuen Gruppenleiters (optional)',value:transferTarget,autoCorrect:'off',autoComplete:'off',autoCapitalize:'none',spellCheck:false,onInput:function(e){setTransferTarget(e.target.value);}}),
          h(DsButton,{variant:'danger',style:{height:48},onClick:deleteOrTransferGroup},
            transferTarget.trim()?'Gruppe \u00fcbertragen':'Gruppe l\u00f6schen'
          )
        )
      )
    ),
    groupActionConfirm&&h(GroupActionConfirmModal,{
      action:groupActionConfirm,
      groupName:selectedGroup&&selectedGroup.name,
      onClose:function(){setGroupActionConfirm(null);},
      onConfirm:function(){
        var action=groupActionConfirm;
        setGroupActionConfirm(null);
        if(action.type==='transfer')runTransferGroup(action.tid);

        else if(action.type==='deleteDeck')runDeleteGroupDeck(action.deckId);

    showConsent&&h(LsConsentModal,{
      onAccept:function(){localStorage.setItem(LS_CONSENT_KEY,'1');window.dispatchEvent(new Event('lp-ls-consent-given'));setShowConsent(false);},

      onShowDat:p.onShowDat||function(){}
    })

/* Echte Freunde-Liste auf der Startseite (ersetzt den fruehreren
   "Dein Netzwerk"-Teaser). Nutzt dieselben lsGet/getLsId-Helfer wie
   LernSpaceView, nur lesend, damit die eigentliche Netzwerk-Ansicht
   unangetastet bleibt. Zeigt ausschliesslich Felder, die im
   Datenmodell wirklich existieren (Name, Avatar, "Freund seit") -
   es gibt aktuell keine Online-Praesenz oder Pro-Freund-Streaks. */
/* Zaehler/Balken-Einflug-Animation, 1:1 aus dem Prototyp uebernommen
   (animateGoalAndStreak / animateCourse): IntersectionObserver mit
   threshold:1 (Element muss komplett sichtbar sein, z.B. beim
   Runterscrollen am Handy), danach 1800ms kubisches Ease-out von 0
   auf den Zielwert, per requestAnimationFrame. Feuert nur einmal pro
   Element. */
function useVisibleCountUp(target,duration){
  var vs=useState(0); var val=vs[0]; var setVal=vs[1];
  var elRef=useRef(null);
  var startedRef=useRef(false);
  var rafRef=useRef(null);
  useEffect(function(){
    if(!elRef.current||startedRef.current)return;
    var disposed=false;
    function begin(){
      if(startedRef.current||disposed)return;
      startedRef.current=true;
      io.disconnect();
      var start=performance.now();
      function step(now){
        var t=Math.min(1,(now-start)/duration);
        var eased=1-Math.pow(1-t,3);
        setVal(eased*target);
        if(t<1)rafRef.current=requestAnimationFrame(step);
      }
      rafRef.current=requestAnimationFrame(step);
    }
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting&&!startedRef.current)onHomeReady(begin);
      });
    },{threshold:1});
    io.observe(elRef.current);
    return function(){disposed=true;io.disconnect();if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[target,duration]);
  return [elRef,val];
}

/* Tagesziel-Karte mit synchron animiertem Streak, Kartenzahl und
   Fortschrittsbalken - ein gemeinsamer Observer/RAF-Lauf fuer alle
   drei Werte, exakt wie animateGoalAndStreak() im Prototyp. */
function LpAnimatedGoalCard(p){
  var elRef=useRef(null);
  var startedRef=useRef(false);
  var rafRef=useRef(null);
  var vs=useState({streak:p.streak>0?1:0,count:0,pct:0}); var vals=vs[0]; var setVals=vs[1];
  useEffect(function(){
    if(!elRef.current||startedRef.current)return;
    var disposed=false;
    function begin(){
      if(startedRef.current||disposed)return;
      startedRef.current=true;
      io.disconnect();
      var duration=1800;
      var start=performance.now();
      var streakTarget=p.streak,countTarget=p.todayCount,pctTarget=p.goalPct;
      function step(now){
        var t=Math.min(1,(now-start)/duration);
        var eased=1-Math.pow(1-t,3);
        setVals({
          streak:streakTarget>0?Math.max(1,Math.round(eased*streakTarget)):0,
          count:Math.round(eased*countTarget),
          pct:eased*pctTarget
        });
        if(t<1)rafRef.current=requestAnimationFrame(step);
      }
      rafRef.current=requestAnimationFrame(step);
    }
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting&&!startedRef.current)onHomeReady(begin);
      });
    },{threshold:1});
    io.observe(elRef.current);
    return function(){disposed=true;io.disconnect();if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[p.streak,p.todayCount,p.goalPct]);
  return h("div",{className:"lp-goal-card",ref:elRef},
    h("div",{className:"lp-goal-card-header"},
      h("div",null,
        h("div",{className:"lp-goal-label"},"Tagesziel"),
        h("div",{className:"lp-goal-count"},vals.count+" / "+p.dailyGoal+" Karten")),
      h("div",{className:"lp-streak-badge"},h("span",null,"🔥"),h("span",null,vals.streak+" Tage"))),
    h(DsProgress,{value:vals.pct,showLabel:false}));
}

  function onDocCarouselScroll(){
    var el=docCarouselRef.current; if(!el)return;
    /* Nicht mehr aus scrollLeft/Kartenbreite hochgerechnet - seit die
       Karten per scroll-snap-align:center (statt "start") verankert
       sind, damit der Leucht-Glow Platz hat (siehe CSS-Kommentar bei
       .lp-doc-carousel), passt die alte Formel nicht mehr zu den
       tatsaechlichen Snap-Positionen. Stattdessen direkt die Karte
       suchen, deren Mittelpunkt am naechsten am Viewport-Mittelpunkt
       liegt - robust unabhaengig von Puffer/Gap/Card-Anzahl pro Seite
       (1 auf Mobile, 3 auf Desktop). */
    var cards=el.querySelectorAll('.lp-doc-carousel-card');
    if(!cards.length)return;
    var viewportCenter=el.scrollLeft+el.clientWidth/2;
    var closest=0,closestDist=Infinity;
    for(var i=0;i<cards.length;i++){
      var cardCenter=cards[i].offsetLeft+cards[i].offsetWidth/2;
      var dist=Math.abs(cardCenter-viewportCenter);
      if(dist<closestDist){closestDist=dist;closest=i;}
    }
    setDocCarouselActive(closest);
  }
  /* Desktop-Pfeil-Buttons (kein Touch-Wisch, keine sichtbare Scrollbar
     dort) - scrollt um genau eine "Seite" weiter/zurueck, egal ob
     gerade 1 (Mobile) oder 3 (Desktop ab 768px) Karten gleichzeitig
     passen. Nicht einfach um clientWidth scrollen (der ist wegen des
     Glow-Puffers absichtlich groesser als eine Kartenbreite, das
     wuerde zu weit springen) - stattdessen die tatsaechlich sichtbare
     Kartenzahl zaehlen und exakt so viele Karten weiterspringen, zur
     naechsten Zielkarte zentriert (passend zu scroll-snap-align:center). */
  function scrollDocCarousel(dir){
    var el=docCarouselRef.current; if(!el)return;
    var cards=el.querySelectorAll('.lp-doc-carousel-card');
    if(!cards.length)return;
    var wrap=el.closest('.lp-doc-carousel-wrap');
    var wrapRect=(wrap||el).getBoundingClientRect();
    var visibleCount=0;
    for(var i=0;i<cards.length;i++){
      var r=cards[i].getBoundingClientRect();
      if(r.left>=wrapRect.left-1&&r.right<=wrapRect.right+1)visibleCount++;
    }
    visibleCount=Math.max(1,visibleCount);
    var viewportCenter=el.scrollLeft+el.clientWidth/2;
    var curIdx=0,curDist=Infinity;
    for(var j=0;j<cards.length;j++){
      var cc=cards[j].offsetLeft+cards[j].offsetWidth/2;
      var d=Math.abs(cc-viewportCenter);
      if(d<curDist){curDist=d;curIdx=j;}
    }
    var targetIdx=Math.max(0,Math.min(cards.length-1,curIdx+dir*visibleCount));
    var target=cards[targetIdx];
    el.scrollTo({left:target.offsetLeft+target.offsetWidth/2-el.clientWidth/2,behavior:'smooth'});
  }

  function handleAuthUser(user){
    _syncUser=user;
    var avatarUrl=user.user_metadata&&(user.user_metadata.avatar_url||user.user_metadata.picture);
    if(avatarUrl){
      /* Sofort die Live-Google-URL als Foto setzen (ein <img src> laedt
         sie direkt, davon ist CORS nicht betroffen). Der Fetch+Base64-
         Umweg darunter ist nur eine Offline-Cache-Optimierung - schlaegt
         er fehl (z.B. CORS beim Byte-Zugriff per fetch()), bleibt die
         Live-URL trotzdem aktiv und das Bild wird weiterhin angezeigt,
         statt komplett zu fehlen. */
      setGooglePhoto(function(cur){return cur||avatarUrl;});
      fetch(avatarUrl).then(function(r){return r.blob();}).then(function(b){
        var rd=new FileReader();
        rd.onload=function(){
          try{localStorage.setItem('kkm-gphoto',rd.result);}catch(e){}
          setGooglePhoto(rd.result);
        };
        rd.readAsDataURL(b);
      }).catch(function(){});
    }
    var sb=getSb();
    sb.from('ls_users').select('ls_id,app_data,username,netzwerk_data').eq('authUid',user.id).maybeSingle().then(function(res){
      if(res.data){
        // Bekannter User — ls_id ggf. wiederherstellen
        var foundId=res.data.ls_id;
        var cur=localStorage.getItem('kkm-ls-id');
        if(cur!==foundId){
          localStorage.setItem('kkm-ls-id',foundId);
          showToast('Willkommen zurück! Dein Account wird wiederhergestellt…');
          setTimeout(function(){window.location.reload();},1000);
          return;
        }
        // Social-Daten vorausladen (für sofortige Anzeige beim LernSpace-Öffnen)
        if(res.data.netzwerk_data) _preloadedLsData=res.data.netzwerk_data;
        // App-Daten wiederherstellen wenn remote neuer
        if(res.data.app_data){
          var remoteTs=res.data.app_data._syncedAt||0;
          var localTs=loadStore()._syncedAt||0;
          if(remoteTs>localTs){
            _applyingRemote=true;
            var restored=applyRemoteExtras(res.data.app_data);
            saveStore(restored);
            setData(restored);
            showToast('Karteikarten wiederhergestellt!');
            dbg('✅ App-Daten aus Supabase wiederhergestellt');
            setTimeout(function(){_applyingRemote=false;},200);
          }
        }
        // Benutzername laden oder Modal zeigen
        if(res.data.username){
          saveSocialUsername(res.data.username);
          setSocialUsername(res.data.username);
        } else {
          setShowUsernameModal(true);
        }
        setupRealtimeSync();
        refreshGateStatus();
        tryRedeemPendingGateCode();
      } else {
        // Neuer Google-User → E-Mail als ls_id
        var emailId=user.email;
        var oldId=localStorage.getItem('kkm-ls-id');
        localStorage.setItem('kkm-ls-id',emailId);
        var currentData=Object.assign({},loadStore(),{_syncedAt:Date.now()});
        getSb().from('ls_users').upsert({ls_id:emailId,authUid:user.id,app_data:currentData,updated_at:new Date().toISOString()},{onConflict:'ls_id',ignoreDuplicates:false})
        .then(function(r){
          if(!r.error){
            dbg('✅ Google-Login: Neuer User erstellt, E-Mail als ID');
            if(oldId&&oldId!==emailId){
              showToast('Willkommen! Dein Account wird eingerichtet…');
              setTimeout(function(){window.location.reload();},800);
            } else {
              setShowUsernameModal(true);
              setupRealtimeSync();
              refreshGateStatus();
              tryRedeemPendingGateCode();
            }
          } else {
            dbg('❌ Upsert Fehler:',r.error.message);
          }
        });
      }
    });
  }

      saveStore(restored);

  useEffect(function(){
    var us=loadUpdStore();

      if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){copyBtn.textContent='✓ Kopiert';setTimeout(function(){copyBtn.textContent='Kopieren';},1500);});}
    };
    clrBtn.onclick=function(){window.__KKM_LOG=[];render();};
    window.__kkmDbgRender=render;
  }
  function render(){
    var log=document.getElementById('kkm-dbg-log');
    if(!log)return;
    log.textContent=(window.__KKM_LOG||[]).join('\n');
    log.scrollTop=log.scrollHeight;
  }
  /* Debug-Overlay ist in der Beta standardmaessig an.
     Ausblenden: ?debug=0 in der URL (merkt sich die Entscheidung),
     wieder einblenden: ?debug=1. */
  function debugEnabled(){
    try{
      if(location.search.indexOf('debug=1')>-1){localStorage.removeItem('kkm-debug-off');return true;}
      if(location.search.indexOf('debug=0')>-1){localStorage.setItem('kkm-debug-off','1');return false;}
      return localStorage.getItem('kkm-debug-off')!=='1';
    }catch(e){ return true; }
  }
  if(!debugEnabled())return;
  if(document.body)build(); else window.addEventListener('DOMContentLoaded',build);
})();

ReactDOM.createRoot(document.getElementById("root")).render(
  h(function Boot(){
    var hs=useState(false); var hiding=hs[0]; var setHiding=hs[1];
    var ss=useState(true); var shown=ss[0]; var setShown=ss[1];
    var mts=useState(false); var minTimeDone=mts[0]; var setMinTimeDone=mts[1];

    /* Freunde-Daten der Startseite bereits hier laden (parallel zum
       Splash) statt erst wenn das Dashboard gerendert wird. Der Splash
       wartet unten darauf, damit die Sektion beim Erreichen der
       Startseite garantiert schon fertig geladen ist. */
    var dfs=useState({loading:true,friends:[]}); var dashFriends=dfs[0]; var setDashFriends=dfs[1];
    /* Als benannte Funktion statt anonym im Effekt, damit App() sie bei
       Bedarf erneut aufrufen kann (z.B. beim Wechsel zur Startseite) -
       sonst bleibt die Freundesliste hier fuer die ganze Session auf dem
       Stand des allerersten Ladens eingefroren und neue Freundschaften,
       die erst waehrend der Sitzung geschlossen wurden, tauchen nie in
       "Freunde aktiv" auf, selbst wenn der Freund online ist. */
    function loadDashFriends(){
      var cancelled=false;
      var myId=getLsId();
      if(!myId){setDashFriends({loading:false,friends:[]});return function(){};}
      lsGet('ls_users',myId).then(function(me){
        /* Alle Freunde vorladen (nicht nur die letzten 3) - die
           Startseite zeigt jetzt die gerade ONLINEN Freunde, das
           muss unabhaengig davon sein, wann die Freundschaft
           geschlossen wurde. */
        var list=((me&&me.friends)||[]).slice().sort(function(a,b){return (b.since||0)-(a.since||0);}).slice(0,30);
        if(!list.length){if(!cancelled)setDashFriends({loading:false,friends:[]});return;}
        Promise.all(list.map(function(f){
          /* Neben dem Profil (fuer Avatar) auch gleich den Benutzernamen
             vorladen und in _unCache schreiben - sonst fetcht UserLabel
             ihn beim Rendern selbst nach und der Name "poppt" Sekunden
             spaeter in die schon sichtbare Zeile nach. */
          var profP=getSb().rpc('ls_get_friend_profile',{p_target_ls_id:f.id}).then(function(res){return res.data||null;}).catch(function(){return null;});
          var unameP=getSb().rpc('ls_lookup_username_by_id',{p_ls_id:f.id}).then(function(res){return res.data||null;}).catch(function(){return null;});
          return Promise.all([profP,unameP]).then(function(r){
            if(r[1])_unCache[f.id]=r[1];
            return {id:f.id,since:f.since,profile:r[0]};
          });
        })).then(function(results){if(!cancelled)setDashFriends({loading:false,friends:results});});
      }).catch(function(){if(!cancelled)setDashFriends({loading:false,friends:[]});});
      return function(){cancelled=true;};
    }
    useEffect(function(){ return loadDashFriends(); },[]);

    function finishSplash(){
      setHiding(function(prevHiding){
        if(prevHiding)return prevHiding;
        setTimeout(function(){setShown(false);},600);
        return true;
      });
    }
    /* Antippen des Splash ueberspringt nur die Mindestlaufzeit der
       Animation - das Warten auf die Freunde-Daten wird NICHT
       umgangen. Sonst hebt ein ungeduldiges Antippen genau das
       Verhalten auf, das hier eingebaut wurde. */
    function skip(){setMinTimeDone(true);}
    useEffect(function(){
      setShown(true);setHiding(false);setMinTimeDone(false);
      /* Mindestlaufzeit, damit die Splash-Animation (Buchstaben,
         Sweep, Ladebalken) immer ganz durchlaeuft, auch wenn die
         Freunde-Daten viel schneller da sind. */
      var t1=setTimeout(function(){setMinTimeDone(true);},8400);
      /* Sicherheitsnetz: falls das Laden haengt, den Splash trotzdem
         irgendwann beenden statt den Nutzer auszusperren. */
      var tMax=setTimeout(finishSplash,15000);
      return function(){clearTimeout(t1);clearTimeout(tMax);};
    },[]);
    useEffect(function(){
      if(minTimeDone&&!dashFriends.loading)finishSplash();
    },[minTimeDone,dashFriends.loading]);

    return h("div",null,shown&&h(Splash,{out:hiding,onSkip:skip}),h(App,{dashFriends:dashFriends,splashHiding:hiding,onRefreshDashFriends:loadDashFriends}));
  },null));

if("serviceWorker" in navigator){
  /* Ein neuer Service Worker (skipWaiting/clients.claim im sw.js) uebernimmt
     zwar sofort im Hintergrund, aber die bereits offene Seite zeigt trotzdem
     weiter den alten geladenen Inhalt, bis sie tatsaechlich neu navigiert -
     "App schliessen und neu oeffnen" reicht dafuer oft NICHT, wenn iOS/
     Android die App nur aus dem Hintergrund holt statt den WebView wirklich
     neu zu laden. controllerchange feuert exakt dann, wenn ein neuer Worker
     die Kontrolle uebernimmt.
     ABER: mitten in einer offenen Interaktion (z.B. gerade ein Modal offen,
     Text eingetippt) reisst ein sofortiger location.reload() den Nutzer
     unangekuendigt raus - das sieht wie ein zufaelliger Absturz/Neustart
     aus. Reload deshalb nur ausloesen, wenn die Seite GERADE (wieder)
     sichtbar wird (App wird aus dem Hintergrund/App-Switcher geholt) -
     das ist der Moment, in dem ein Neuladen ohnehin wie ein normaler
     App-Start wirkt. WICHTIG: nicht waehrend die Seite versteckt/im
     Hintergrund ist ausloesen - iOS pausiert/friert die WebView beim
     Backgrounding oft an, dann kann location.reload() haengenbleiben
     oder gar nicht erst ausgefuehrt werden (genau das war der Grund,
     warum neue Versionen trotz mehrfachem Schliessen/Neuoeffnen nicht
     ankamen).
     SONDERFALL "App komplett geschlossen und frisch neu geoeffnet": die
     neue Seite laedt zunaechst noch ueber den ALTEN Worker (der neue
     braucht einen Moment zum Installieren/Aktivieren), controllerchange
     feuert dann kurz nach dem Start - aber die Seite ist in dem Moment
     schon wieder sichtbar, also haette der obige "erst beim naechsten
     Zurueckkehren"-Fall noch eine ZWEITE Schliessen/Oeffnen-Runde
     gebraucht. Feuert controllerchange innerhalb der ersten paar
     Sekunden nach dem Laden (noch vor jeder echten Interaktion,
     typischerweise waehrend des Splashscreens), reicht ein sofortiger
     Reload also aus - stoert niemanden mitten in der Nutzung. */
  var pageLoadedAt=Date.now();
  var swReloaded=false;
  var pendingSwReload=false;
  /* Nach einem harten Reload durch checkForNewVersionIndependent() (SW
     abgemeldet + Caches geleert) uebernimmt der frisch installierte SW
     die Kontrolle einer zuvor unkontrollierten Seite - das loest genauso
     ein controllerchange aus wie ein echtes neues Update, obwohl der
     Inhalt bereits topaktuell ist. Ohne diese Sperre reloadet die Seite
     sich dadurch ein zweites (manchmal drittes) Mal in Folge - genau das
     mehrfache Neuladen des Splashscreens, das Sophie gemeldet hat. */
  /* Gilt fuer die GESAMTE Lebensdauer dieses einen Seitenaufrufs (bewusst
     nicht nach dem ersten Verbrauch zurueckgesetzt): sowohl der native
     controllerchange-Reload als auch checkForNewVersionIndependent()
     koennen unabhaengig voneinander ausloesen (Wettlauf beim Laden) -
     gewinnt einer von beiden, ist der Inhalt bereits topaktuell und der
     jeweils andere darf auf DIESER Seite auf keinen Fall nochmal
     nachreloaden, egal in welcher Reihenfolge/Verzoegerung er feuert. */
  var justHardReloaded=sessionStorage.getItem("kkm-just-hard-reloaded")==="1";
  sessionStorage.removeItem("kkm-just-hard-reloaded");
  function doSwReload(){
    if(swReloaded)return; swReloaded=true;
    sessionStorage.setItem("kkm-just-hard-reloaded","1");
    location.reload();
  }
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(justHardReloaded)return;
    pendingSwReload=true;
    var justLaunched=(Date.now()-pageLoadedAt)<4000;
    if(justLaunched&&document.visibilityState==="visible")doSwReload();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&pendingSwReload)doSwReload();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update().catch(function(){});
      /* Kommt die App aus dem Hintergrund zurueck (Homescreen-Wechsel,
         App-Switcher), erneut auf ein neues sw.js pruefen - der einmalige
         Check beim Laden reicht bei einer PWA nicht, die tagelang nur
         pausiert statt neu geladen wird. */
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible")reg.update().catch(function(){});
      });
    }).catch(function(){});
  });

  /* Zusaetzliche, vom SW-Lifecycle UNABHAENGIGE Versionspruefung:
     controllerchange/skipWaiting/clients.claim verlassen sich darauf, dass
     der Browser den SW-Lifecycle korrekt durchlaeuft - bei als Homescreen-
     Icon installierten PWAs unter iOS/WebKit ist genau das nachweislich
     unzuverlaessig (der neue Worker installiert/aktiviert manchmal nicht
     oder controllerchange feuert nie), wodurch Nutzer trotz obigem
     Mechanismus dauerhaft auf einer alten Version haengen bleiben koennen,
     ohne dass irgendein Fehler sichtbar wird. Dieser Check umgeht das
     komplett: sw.js wird direkt und ungecached vom Netz gelesen (network-
     only, siehe sw.js fetch-Handler), die darin enthaltene CACHE-Version
     mit dem zuletzt bekannten Stand verglichen - weicht sie ab, werden SW
     und Caches hart entfernt und die Seite neu geladen, statt auf den
     (moeglicherweise nie kommenden) nativen Lifecycle zu warten. */
  function checkForNewVersionIndependent(){
    if(swReloaded)return;
    fetch("./sw.js",{cache:"no-store"}).then(function(r){return r.text();}).then(function(txt){
      if(swReloaded)return;
      var m=txt.match(/const CACHE = '([^']+)'/);
      if(!m)return;
      var latest=m[1];
      var known=localStorage.getItem("kkm-known-sw-cache");
      /* Bookkeeping IMMER synchron halten, nicht nur wenn WIR reloaden -
         sonst bleibt "known" veraltet, wenn stattdessen der native
         controllerchange-Reload (oben) die Aktualisierung uebernommen
         hat, und dieser Check haelt die Seite faelschlich weiter fuer
         veraltet und reloadet beim naechsten Aufruf noch ein drittes
         Mal, obwohl der Inhalt laengst aktuell ist. */
      localStorage.setItem("kkm-known-sw-cache",latest);
      if(!known)return;
      if(known===latest)return;
      if(justHardReloaded)return;
      swReloaded=true;
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));}),
        (typeof caches!=="undefined")?caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}):Promise.resolve()
      ]).then(function(){sessionStorage.setItem("kkm-just-hard-reloaded","1");location.reload();}).catch(function(){sessionStorage.setItem("kkm-just-hard-reloaded","1");location.reload();});
    }).catch(function(){});
  }
  window.addEventListener("load",checkForNewVersionIndependent);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible")checkForNewVersionIndependent();
  });
}
