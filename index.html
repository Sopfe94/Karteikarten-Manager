<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karteikarten Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1260">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karteikarten">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#0d0b25; --c-surf:#1a1540; --c-card:#221d52;
  --c-pur:#8b5cf6; --c-pur2:#a78bfa; --c-pdim:rgba(139,92,246,.25);
  --c-gold:#fbbf24; --c-ora:#f97316; --c-grn:#10b981; --c-red:#ef4444;
  --c-bor:rgba(139,92,246,.3); --c-bor2:rgba(139,92,246,.5);
  --c-txt:#ffffff; --c-dim:rgba(255,255,255,.65); --c-fnt:rgba(255,255,255,.3);
  --s-pur:0 0 20px rgba(139,92,246,.5);
  --s-gld:0 0 20px rgba(251,191,36,.4);
  --s-ora:0 0 18px rgba(249,115,22,.5);
}
html,body{height:100%;font-family:"Nunito",sans-serif;color:var(--c-txt);
  background:var(--c-bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.12) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(251,191,36,.07) 0%,transparent 40%)}
#root{min-height:100vh}

/* SPLASH */
.spl{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#2a1060 0%,#0d0b25 70%);
  transition:opacity .6s ease,transform .6s ease}
.spl.out{opacity:0;transform:scale(1.05);pointer-events:none}
.spl-glow{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.4) 0%,transparent 70%);
  animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.spl-logo{width:130px;height:130px;border-radius:28px;position:relative;z-index:1;
  filter:drop-shadow(0 0 30px rgba(139,92,246,.8));
  animation:sl .8s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes sl{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.spl-title{margin-top:22px;font-size:1.7rem;font-weight:900;position:relative;z-index:1;
  background:linear-gradient(135deg,#fff 0%,#a78bfa 50%,#fbbf24 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:fu .6s ease .5s both}
.spl-sub{margin-top:8px;font-size:.9rem;color:rgba(255,255,255,.5);font-weight:600;
  position:relative;z-index:1;animation:fu .6s ease .7s both}
.spl-dots{display:flex;gap:8px;margin-top:32px;position:relative;z-index:1;animation:fu .5s ease .9s both}
.spl-dot{width:8px;height:8px;border-radius:50%;animation:db 1.2s ease-in-out infinite}
.spl-dot:nth-child(1){background:var(--c-pur)}
.spl-dot:nth-child(2){background:var(--c-pur2);animation-delay:.2s}
.spl-dot:nth-child(3){background:var(--c-gold);animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(.7);opacity:.3}40%{transform:scale(1.3);opacity:1}}
@keyframes fu{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* HEADER */
.hdr{background:rgba(13,11,37,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--c-bor);position:sticky;top:0;z-index:100;
  padding-left:16px;padding-right:16px;
  padding-top:max(env(safe-area-inset-top),14px);
  padding-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.logo-img{width:36px;height:36px;border-radius:10px;filter:drop-shadow(0 0 8px rgba(139,92,246,.6))}
.logo-txt{font-size:.95rem;font-weight:800;white-space:nowrap;
  background:linear-gradient(135deg,#fff,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav{display:flex;gap:4px;align-items:center}
.nb{padding:6px 10px;border:none;background:transparent;border-radius:8px;
  font-family:"Nunito",sans-serif;font-size:.78rem;font-weight:700;
  color:var(--c-dim);cursor:pointer;transition:all .15s;white-space:nowrap}
.nb:hover{background:var(--c-pdim);color:var(--c-txt)}
.nb.on{background:rgba(139,92,246,.25);color:var(--c-pur2);border:1px solid var(--c-bor)}
.nb-q{width:28px;height:28px;padding:0;border-radius:50%;
  border:1.5px solid rgba(139,92,246,.6);
  background:rgba(139,92,246,.25);
  color:var(--c-pur2);font-size:.82rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:"Nunito",sans-serif;flex-shrink:0;transition:all .15s}
.nb-q:hover{background:rgba(139,92,246,.45)}
.bdg{display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;background:var(--c-gold);color:#000;
  border-radius:50%;font-size:.6rem;font-weight:900;margin-left:4px}

/* MAIN */
.main{max-width:860px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1}
.pg-title{font-size:1.5rem;font-weight:800;margin-bottom:4px;
  background:linear-gradient(135deg,#fff,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pg-sub{color:var(--c-dim);font-size:.87rem;margin-bottom:22px;font-weight:600}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;
  border:none;font-family:"Nunito",sans-serif;font-size:.87rem;font-weight:700;
  cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:var(--s-pur)}
.btn-p:hover{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.btn-g{background:rgba(255,255,255,.08);color:var(--c-dim);border:1px solid var(--c-bor)}
.btn-g:hover{background:rgba(255,255,255,.12);color:var(--c-txt)}
.btn-o{background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;box-shadow:var(--s-ora)}
.btn-grn{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-gold{background:linear-gradient(135deg,#d97706,#fbbf24);color:#000;font-weight:800}
.btn-gold:hover{box-shadow:var(--s-gld)}
.ibtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;
  cursor:pointer;color:var(--c-dim);font-size:.9rem;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.ibtn:hover{background:var(--c-pdim);color:var(--c-txt)}
.ibtn-del:hover{background:rgba(239,68,68,.2);color:var(--c-red)}

/* OVERLAY / MODAL */
.ov{position:fixed;inset:0;background:rgba(8,5,26,.8);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
  padding-top:max(env(safe-area-inset-top),16px);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow-y:auto}
.modal{background:var(--c-surf);border:1px solid var(--c-bor2);border-radius:18px;
  padding:22px;width:100%;max-width:460px;
  box-shadow:0 24px 64px rgba(0,0,0,.6),var(--s-pur);
  max-height:calc(100dvh - 80px);overflow-y:auto}
.modal-title{font-size:1.1rem;font-weight:800;margin-bottom:16px;
  background:linear-gradient(135deg,#fff,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* FORM */
.fg{margin-bottom:13px}
.fl{display:block;font-size:.73rem;font-weight:800;color:var(--c-pur2);
  margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.fi,.fta,.fsel{width:100%;padding:9px 12px;border:1.5px solid var(--c-bor);border-radius:9px;
  font-family:"Nunito",sans-serif;font-size:.92rem;color:var(--c-txt);
  background:rgba(255,255,255,.05);outline:none;transition:border-color .15s}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--c-pur);background:rgba(139,92,246,.08)}
.fta{resize:vertical;min-height:78px}
.fsel option{background:var(--c-surf)}
.erow{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.eopt{width:36px;height:36px;border-radius:8px;border:2px solid transparent;
  background:rgba(255,255,255,.07);cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.eopt.sel,.eopt:hover{border-color:var(--c-pur);background:var(--c-pdim)}

/* DECK GRID */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dcard{background:var(--c-card);border:1px solid var(--c-bor);border-radius:14px;
  padding:16px;cursor:pointer;transition:all .22s}
.dcard:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,92,246,.3)}
.dcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.demoji{font-size:1.9rem}
.dcard-acts{display:flex;gap:3px}
.dname{font-size:1rem;font-weight:800;margin-bottom:3px}
.dmeta{font-size:.77rem;color:var(--c-dim)}
.dpill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;
  padding:3px 9px;font-size:.71rem;font-weight:700;margin-top:8px}
.dpill-due{background:rgba(249,115,22,.2);color:#fb923c;border:1px solid rgba(249,115,22,.3)}
.dpill-ok{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.add-deck{border:2px dashed var(--c-bor);border-radius:14px;padding:16px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;color:var(--c-fnt);font-size:.87rem;font-weight:700;
  transition:all .2s;min-height:112px}
.add-deck:hover{border-color:var(--c-pur);color:var(--c-pur2);background:var(--c-pdim)}

/* DECK DETAIL */
.back-btn{display:inline-flex;align-items:center;gap:5px;color:var(--c-dim);
  font-size:.84rem;cursor:pointer;border:none;background:none;
  padding:4px 0;margin-bottom:16px;font-weight:700;font-family:"Nunito",sans-serif}
.back-btn:hover{color:var(--c-pur2)}
.dhdr{display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:10px}
.dhl{display:flex;align-items:center;gap:11px}
.dbig{font-size:2.3rem;filter:drop-shadow(0 0 10px rgba(139,92,246,.5))}
.dname2{font-size:1.5rem;font-weight:800;
  background:linear-gradient(135deg,#fff,#c4b5fd);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dstats{display:flex;gap:12px;margin-top:3px}
.dstat{font-size:.79rem;color:var(--c-dim);font-weight:600}
.dstat span{font-weight:800;color:var(--c-pur2)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{background:var(--c-card);border:1px solid var(--c-bor);border-radius:9px;
  padding:11px 13px;display:flex;align-items:center;gap:9px}
.citxt{flex:1;min-width:0}
.cf{font-size:.91rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{font-size:.75rem;color:var(--c-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctag{font-size:.67rem;color:var(--c-pur2);flex-shrink:0;font-weight:700}

/* STUDY */
.pbar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:24px}
.pfill{height:100%;background:linear-gradient(90deg,var(--c-pur),var(--c-gold));
  border-radius:3px;transition:width .4s}
.shdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px}
.scnt{font-size:.87rem;color:var(--c-dim);font-weight:700}
.scnt strong{color:var(--c-pur2)}
.scene{perspective:1000px;width:100%;max-width:500px;height:280px;
  margin:0 auto 24px;cursor:pointer}
@media(max-width:480px){.scene{height:240px}}
.flip-inner{width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.25,.46,.45,.94)}
.flip-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;
  background:var(--c-card);border:1px solid var(--c-bor);border-radius:18px;
  box-shadow:0 10px 36px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center}
.face-back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a1540,#2d1b6b)}
.flbl{position:absolute;top:13px;left:16px;font-size:.64rem;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--c-pur2);opacity:.65}
.ftxt{font-size:1.35rem;font-weight:700;line-height:1.5}
.fhnt{position:absolute;bottom:13px;font-size:.7rem;color:var(--c-fnt);font-weight:600}
.sacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sacts .btn{padding:11px 24px;font-size:.92rem;border-radius:11px}

/* DONE */
.done{background:var(--c-surf);border:1px solid var(--c-bor2);border-radius:18px;
  padding:34px 24px;text-align:center;max-width:380px;
  margin:40px auto;box-shadow:0 12px 48px rgba(0,0,0,.5),var(--s-pur)}
.done-i{font-size:2.8rem;margin-bottom:9px}
.done-t{font-size:1.45rem;font-weight:800;margin-bottom:6px;
  background:linear-gradient(135deg,#fff,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.done-s{color:var(--c-dim);margin-bottom:18px;font-size:.88rem;font-weight:600}
.done-row{display:flex;gap:22px;justify-content:center;margin-bottom:20px}
.dn{font-size:1.9rem;font-weight:900}
.dn-g{color:var(--c-grn)}
.dn-r{color:var(--c-ora)}
.dl{font-size:.7rem;color:var(--c-dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700}

/* REMINDER */
.rbox{background:var(--c-surf);border:1px solid var(--c-bor);border-radius:14px;padding:22px;max-width:480px}
.rbox-t{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.rbox-s{font-size:.82rem;color:var(--c-dim);margin-bottom:16px;font-weight:600}
.spill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  border-radius:20px;font-size:.79rem;font-weight:700;margin-bottom:14px}
.spill-on{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.spill-off{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.25)}
.trow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.trow input[type=time]{font-size:1.9rem;font-weight:800;font-family:"Nunito",sans-serif;
  color:var(--c-txt);border:2px solid var(--c-bor);border-radius:11px;
  padding:9px 14px;background:rgba(255,255,255,.06);outline:none;cursor:pointer;width:165px}
.trow input[type=time]:focus{border-color:var(--c-pur)}
.hbox{margin-top:16px;padding:13px 15px;background:rgba(255,255,255,.04);
  border-radius:9px;border:1px solid var(--c-bor);
  font-size:.79rem;color:var(--c-dim);line-height:1.75;font-weight:600}
.hbox strong{color:var(--c-txt)}
.steps{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.step{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;
  background:rgba(139,92,246,.08);border-radius:7px;border:1px solid var(--c-pdim)}
.snum{width:21px;height:21px;background:var(--c-pur);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}
.stxt{font-size:.81rem;line-height:1.5}
.stxt strong{color:var(--c-gold)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;
  padding:10px 20px;border-radius:11px;font-size:.87rem;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:500;white-space:nowrap;
  border:1px solid var(--c-bor2);pointer-events:none}

/* EMPTY */
.empty{text-align:center;padding:44px 16px;color:var(--c-dim)}
.empty-i{font-size:2.8rem;margin-bottom:9px;opacity:.4}
.empty p{margin-bottom:13px;font-weight:600}

/* FOOTER */
.footer-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  margin-top:22px;padding-top:14px;border-top:1px solid rgba(139,92,246,.2)}
.foot-btn{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);
  color:var(--c-pur2);font-size:.8rem;font-weight:700;cursor:pointer;
  font-family:"Nunito",sans-serif;padding:8px 15px;border-radius:8px;transition:all .15s}
.foot-btn:hover{background:rgba(139,92,246,.25)}

/* OPTION CARD (study mode select) */
.opt-card{display:block;width:100%;text-align:left;padding:15px;border-radius:11px;
  cursor:pointer;transition:all .15s;margin-bottom:9px;font-family:"Nunito",sans-serif;
  border:2px solid var(--c-bor);background:rgba(255,255,255,.04);color:var(--c-txt)}
.opt-card:hover{background:rgba(255,255,255,.08)}
.opt-card.sel-pur{background:rgba(139,92,246,.2);border-color:var(--c-pur)}
.opt-card.sel-gld{background:rgba(251,191,36,.15);border-color:var(--c-gold)}
.opt-card.sel-grn{background:rgba(16,185,129,.15);border-color:#10b981}
.opt-card.sel-ora{background:rgba(249,115,22,.15);border-color:#f97316}
.opt-title{font-weight:800;font-size:.95rem;margin-bottom:3px}
.opt-desc{font-size:.8rem;color:var(--c-dim);font-weight:600}

/* LEGAL */
.legal-body{font-size:.87rem;line-height:1.85;color:var(--c-dim);max-height:60dvh;overflow-y:auto}
.legal-body p{margin-bottom:10px}
.legal-body ul{padding-left:18px;margin-bottom:10px}
.legal-h{font-weight:800;color:var(--c-txt);margin-bottom:3px;display:block}

/* Audiobook */
.ab-wrap{background:var(--c-surf);border:1px solid var(--c-bor);border-radius:16px;padding:24px;margin-top:20px}
.ab-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.ab-title{font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.provider-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.prov-btn{padding:14px 8px;border-radius:12px;border:2px solid var(--c-bor);background:rgba(255,255,255,.04);cursor:pointer;font-family:"Nunito",sans-serif;font-size:.8rem;font-weight:700;color:var(--c-txt);transition:all .18s;text-align:center;line-height:1.4}
.prov-btn:hover{background:rgba(139,92,246,.15);border-color:var(--c-pur);transform:translateY(-1px)}
.prov-btn.sel{background:rgba(139,92,246,.25);border-color:var(--c-pur);color:var(--c-pur2);box-shadow:0 0 14px rgba(139,92,246,.25)}
.genre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.genre-btn{padding:14px 6px;border-radius:12px;border:2px solid var(--c-bor);background:rgba(255,255,255,.04);cursor:pointer;font-family:"Nunito",sans-serif;font-size:.78rem;font-weight:700;color:var(--c-txt);transition:all .18s;text-align:center;line-height:1.4}
.genre-btn:hover{background:rgba(139,92,246,.15);border-color:var(--c-pur);transform:translateY(-1px)}

var SRS_DAYS = [0,1,2,4,8,16,30];

// -- Helpers -------------------------------------------------------------------
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(s,n){ var d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function getDue(deck){ var t=todayStr(); return deck.cards.filter(function(c){ return !c.nextReview||c.nextReview<=t; }); }
function advance(card,knew){
  if(!knew) return Object.assign({},card,{lvl:0,nextReview:todayStr()});
  var lvl = Math.min((card.lvl||0)+1, SRS_DAYS.length-1);
  return Object.assign({},card,{lvl:lvl, nextReview:addDays(todayStr(),SRS_DAYS[lvl])});
}
function loadStore(){ try{ var r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):{decks:[],reminder:null}; }catch(e){ return {decks:[],reminder:null}; }}
function saveStore(d){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(d)); }catch(e){} }
function swMsg(m){ if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage(m); }
function idbPut(k,v){ try{ var r=indexedDB.open("kk-sw",1); r.onupgradeneeded=function(e){e.target.result.createObjectStore("kv")}; r.onsuccess=function(e){var tx=e.target.result.transaction("kv","readwrite");tx.objectStore("kv").put(v,k)}; }catch(e){} }

// -- Export / Import -----------------------------------------------------------
function makeDeckFile(deck){
  var obj={version:1,name:deck.name,emoji:deck.emoji,exported:todayStr(),
    cards:deck.cards.map(function(c){return {front:c.front,back:c.back};})};
  var json=JSON.stringify(obj,null,2);
  var blob=new Blob([json],{type:"application/json"});
  var name=deck.name.replace(/[^a-zA-Z0-9]/g,"_")+".kkm.json";
  return {blob:blob,name:name,json:json};
}
function downloadDeck(deck){
  var f=makeDeckFile(deck);
  var url=URL.createObjectURL(f.blob);
  var a=document.createElement("a"); a.href=url; a.download=f.name; a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function shareDeck(deck,onFallback){
  var f=makeDeckFile(deck);
  if(navigator.share){
    var file=new File([f.blob],f.name,{type:"application/json"});
    var ok=false; try{ok=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
    if(ok){ navigator.share({files:[file],title:"Karteikarten: "+deck.name}).catch(function(e){if(e.name!=="AbortError")onFallback(f.name);}); return; }
    navigator.share({title:"Karteikarten: "+deck.name,text:f.json}).catch(function(){onFallback(f.name);}); return;
  }
  downloadDeck(deck); onFallback(f.name);
}
function parseDeckFile(str){
  try{
    var d=JSON.parse(str);
    if(!d.cards||!Array.isArray(d.cards)) return null;
    return {id:uid(),name:d.name||"Import",emoji:d.emoji||"📚",created:todayStr(),
      cards:d.cards.filter(function(c){return c.front&&c.back;})
        .map(function(c){return {id:uid(),front:c.front,back:c.back,lvl:0,nextReview:todayStr()};})};
  }catch(e){return null;}
}

function useToast(){
  var s=useState(""); var msg=s[0]; var set=s[1];
  function show(m){set(m);setTimeout(function(){set("");},3000);}
  return [msg,show];
}
function Toast(p){ return p.msg?h("div",{className:"toast"},p.msg):null; }

}

  var ns=useState(p.deck?p.deck.name:""); var n=ns[0]; var sn=ns[1];
  var es=useState(p.deck?p.deck.emoji:"📚"); var e=es[0]; var se=es[1];
  function save(){ if(n.trim()) p.onSave({name:n.trim(),emoji:e}); }
  return h("div",{className:"ov",onClick:p.onClose},
    h("div",{className:"modal",onClick:function(ev){ev.stopPropagation();}},
      h("div",{className:"modal-title"},p.deck?"Stapel bearbeiten":"Neuer Stapel"),
      h("div",{className:"fg"},h("label",{className:"fl"},"Name"),
        h("input",{className:"fi",value:n,onInput:function(ev){sn(ev.target.value);},

          onKeyDown:function(ev){if(ev.key==="Enter")save();}})),
      h("div",{className:"fg"},h("label",{className:"fl"},"Symbol"),
        h("div",{className:"erow"},EMOJIS.map(function(em){
          return h("button",{key:em,className:"eopt"+(e===em?" sel":""),onClick:function(){se(em);}},em);

      h("div",{className:"modal-foot"},
        h("button",{className:"btn btn-g",onClick:p.onClose},"Abbrechen"),
        h("button",{className:"btn btn-p",onClick:save},"Speichern"))));
}

function CardModal(p){
  var fs=useState(p.card?p.card.front:""); var f=fs[0]; var sf=fs[1];
  var bs=useState(p.card?p.card.back:""); var b=bs[0]; var sb=bs[1];
  function save(){ if(f.trim()&&b.trim()) p.onSave({front:f.trim(),back:b.trim()}); }
  return h("div",{className:"ov",onClick:p.onClose},
    h("div",{className:"modal",onClick:function(ev){ev.stopPropagation();}},

function ImportModal(p){

    var rd=new FileReader();
    rd.onload=function(e){
      var deck=parseDeckFile(e.target.result);
      if(!deck){setSt("err");setMsg("Ungueltige Datei.");return;}
      setPrev(deck); setSt("preview");

  var vs=useState("decks"); var view=vs[0]; var setView=vs[1];
  var dis=useState(null); var deckId=dis[0]; var setDeckId=dis[1];
  var sns=useState(false); var showNew=sns[0]; var setShowNew=sns[1];
  var eds=useState(null); var editDeck=eds[0]; var setEditDeck=eds[1];
  var sis=useState(false); var showImport=sis[0]; var setShowImport=sis[1];
  var shs=useState(false); var showHelp=shs[0]; var setShowHelp=shs[1];
  var sims=useState(false); var showImp=sims[0]; var setShowImp=sims[1];
  var sdts=useState(false); var showDat=sdts[0]; var setShowDat=sdts[1];
  var sbls=useState(false); var showBetaLogin=sbls[0]; var setShowBetaLogin=sbls[1];
  var bls=useState(function(){return isBetaUnlocked();}); var betaOn=bls[0]; var setBetaOn=bls[1];
  // QuickStudy
  var qss=useState(null); var qsStep=qss[0]; var setQsStep=qss[1];
  var qds=useState([]); var qsDecks=qds[0]; var setQsDecks=qds[1];
  var qcs=useState(null); var qsConfig=qcs[0]; var setQsConfig=qcs[1];
  var tm=useToast(); var toast=tm[0]; var showToast=tm[1];

  useEffect(function(){
    saveStore(data);
    var due=(data.decks||[]).reduce(function(s,d){return s+getDue(d).length;},0);
    swMsg({type:"UPDATE_DUE",dueCount:due});
  },[data]);

  function patch(pp){ setData(function(prev){return Object.assign({},prev,pp);}); }
  var decks=data.decks||[];
  var dueTotal=decks.reduce(function(s,d){return s+getDue(d).length;},0);
  var activeDeck=decks.find(function(d){return d.id===deckId;});

  function addDeck(d){ patch({decks:decks.concat([Object.assign({id:uid()},d,{cards:[],created:todayStr()})])}); setShowNew(false); showToast("Stapel erstellt!"); }
  function saveEditDeck(d){ patch({decks:decks.map(function(dk){return dk.id===editDeck.id?Object.assign({},dk,d):dk;})}); setEditDeck(null); }
  function delDeck(id){ if(!confirm("Stapel loeschen?")) return; patch({decks:decks.filter(function(d){return d.id!==id;})}); if(deckId===id)setDeckId(null); }
  function doImport(deck){ patch({decks:decks.concat([deck])}); setShowImport(false); showToast(deck.name+" importiert!"); }
  function updateDeck(u){ patch({decks:decks.map(function(d){return d.id===u.id?u:d;})}); }
  function finishQs(upd){
    if(upd){ var nd=decks.map(function(d){ var qd=qsDecks.find(function(x){return x.id===d.id;}); if(!qd)return d; return Object.assign({},d,{cards:d.cards.map(function(c){return upd[c.id]||c;})}); }); patch({decks:nd}); }
    setQsStep(null); setQsConfig(null); setQsDecks([]);
  }

  return h("div",{style:{minHeight:"100vh",background:"var(--c-bg)"}},
    // HEADER
    h("header",{className:"hdr"},
      h("div",{className:"logo-wrap",onClick:function(){setView("decks");setDeckId(null);}},
        h("img",{className:"logo-img",src:LOGO,alt:"Logo"})),
      h("nav",{className:"nav"},
        h("button",{className:"nb"+(view==="decks"?" on":""),onClick:function(){setView("decks");setDeckId(null);}},
          "Stapel",dueTotal>0?h("span",{className:"bdg"},dueTotal):null),
        h("button",{className:"nb"+(view==="reminder"?" on":""),onClick:function(){setView("reminder");setDeckId(null);}},
          "Erinnerung"),
        h("button",{className:"nb-q",onClick:function(){setShowHelp(true);},"aria-label":"Hilfe"},"?"))),

    // CONTENT
    h("main",{className:"main"},
      // DECK LIST
      view==="decks"&&!activeDeck&&!qsStep&&h("div",null,
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px",flexWrap:"wrap",gap:"9px"}},
          h("div",{className:"pg-title"},"Meine Stapel"),
          decks.length>0&&h("button",{className:"btn btn-gold",onClick:function(){setQsStep("select");}},"Jetzt lernen")),
        h("div",{className:"pg-sub"},"Alles wird nur lokal auf deinem Geraet gespeichert."),
        h("div",{className:"dgrid"},
          decks.map(function(deck){
            var due=getDue(deck);
            return h("div",{className:"dcard",key:deck.id,onClick:function(){setDeckId(deck.id);}},
              h("div",{className:"dcard-top"},
                h("div",{className:"demoji"},deck.emoji),
                h("div",{className:"dcard-acts"},
                  h("button",{className:"ibtn",onClick:function(ev){ev.stopPropagation();setEditDeck(deck);}},"✏️"),
                  h("button",{className:"ibtn ibtn-del",onClick:function(ev){ev.stopPropagation();delDeck(deck.id);}},"🗑️"))),
              h("div",{className:"dname"},deck.name),
              h("div",{className:"dmeta"},deck.cards.length+" Karten"),
              h("div",{className:"dpill "+(due.length>0?"dpill-due":"dpill-ok")},due.length>0?""+due.length+" fällig":"Alles erledigt"));
          }),
          h("div",{className:"add-deck",onClick:function(){setShowNew(true);}},h("div",{style:{fontSize:"2rem"}},"✨"),"Neuer Stapel")),
        h("div",{style:{marginTop:"18px",paddingTop:"18px",borderTop:"1px solid var(--c-bor)"}},
          h("button",{className:"btn btn-g",onClick:function(){setShowImport(true);}},"Stapel importieren")),
        h("div",{className:"footer-btns"},
          h("button",{className:"foot-btn",onClick:function(){setShowImp(true);}},"Impressum"),
          h("button",{className:"foot-btn",onClick:function(){setShowDat(true);}},"Datenschutz"),
          h("button",{
            style:{background:"none",border:"none",color:"rgba(255,255,255,.18)",fontSize:".72rem",fontWeight:600,cursor:"pointer",fontFamily:"\"Nunito\",sans-serif",padding:"6px 10px",borderRadius:"6px",transition:"all .2s"},
            onClick:function(){betaOn?(confirm("Beta-Modus deaktivieren?")&&(lockBeta(),setBetaOn(false))):setShowBetaLogin(true);}
          },betaOn?"\u2713 Beta aktiv":"Beta"))),

      // DECK DETAIL
      view==="decks"&&activeDeck&&!qsStep&&h(DeckDetail,{deck:activeDeck,onBack:function(){setDeckId(null);},onUpdate:updateDeck,betaOn:betaOn}),

      // QUICK STUDY
      qsStep==="study"&&h(MultiStudyView,{decks:qsDecks,config:qsConfig,onFinish:finishQs}),

      // REMINDER
      view==="reminder"&&!qsStep&&h(ReminderView,{reminder:data.reminder,decks:decks,onSave:function(r){patch({reminder:r});}})),

    // MODALS
    showNew&&h(DeckModal,{onSave:addDeck,onClose:function(){setShowNew(false);}}),
    editDeck&&h(DeckModal,{deck:editDeck,onSave:saveEditDeck,onClose:function(){setEditDeck(null);}}),
    showImport&&h(ImportModal,{onImport:doImport,onClose:function(){setShowImport(false);}}),
    showHelp&&h(HelpModal,{onClose:function(){setShowHelp(false);}}),
    showImp&&h(ImpressumModal,{onClose:function(){setShowImp(false);}}),
    showDat&&h(DatenschutzModal,{onClose:function(){setShowDat(false);}}),

    // QUICK STUDY MODALS
    qsStep==="select"&&h(DeckSelectModal,{decks:decks,onNext:function(sel){setQsDecks(sel);setQsStep("mode");},onClose:function(){setQsStep(null);}}),
    qsStep==="mode"&&h(StudyModeModal,{decks:qsDecks,onStart:function(cfg){setQsConfig(cfg);setQsStep("study");},onNext:function(){setQsStep("order");},onBack:function(){setQsStep("select");},onClose:function(){setQsStep(null);}}),
    qsStep==="order"&&h(DeckOrderModal,{decks:qsDecks,onStart:function(cfg){setQsConfig(cfg);setQsStep("study");},onBack:function(){setQsStep("mode");},onClose:function(){setQsStep(null);}}),

    h(Toast,{msg:toast}),
    showBetaLogin&&h(BetaLoginModal,{onClose:function(){setShowBetaLogin(false);},onSuccess:function(){setBetaOn(true);setShowBetaLogin(false);showToast("Beta-Modus aktiviert! Öffne einen Stapel für den Hörbuch Generator.");}}));
}

// -- Boot ----------------------------------------------------------------------
ReactDOM.createRoot(document.getElementById("root")).render(
  h(function Boot(){
    var hs=useState(false); var hiding=hs[0]; var setHiding=hs[1];
    var ss=useState(true); var shown=ss[0]; var setShown=ss[1];
    useEffect(function(){
      setShown(true); setHiding(false);
      var t1=setTimeout(function(){setHiding(true);},4500);
      var t2=setTimeout(function(){setShown(false);},5200);
      return function(){clearTimeout(t1);clearTimeout(t2);};
    },[]);
    return h("div",null, shown&&h(Splash,{out:hiding}), h(App,null));
  },null)
);

// pageshow reload removed - caused infinite loop on iOS PWA

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update().catch(function(){});
    }).catch(function(){});
    // Listen for SW_UPDATED message - reload to get new version
    navigator.serviceWorker.addEventListener("message",function(e){
      if(e.data&&e.data.type==="SW_UPDATED"){
        window.location.reload();
      }
    });
  });
}
</script>
</body>
</html>
