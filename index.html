<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Karteikarten Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1260">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karteikarten">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d0b25;--surf:#1a1540;--card:#221d52;--raised:#2d2870;
      --purple:#8b5cf6;--purple2:#a78bfa;--pdim:rgba(139,92,246,.25);
      --gold:#fbbf24;--orange:#f97316;--green:#10b981;--red:#ef4444;
      --border:rgba(139,92,246,.3);--border2:rgba(139,92,246,.5);
      --text:#fff;--dim:rgba(255,255,255,.65);--faint:rgba(255,255,255,.3);
      --gp:0 0 20px rgba(139,92,246,.5);--gg:0 0 20px rgba(251,191,36,.4);
      --go:0 0 18px rgba(249,115,22,.5);
    }
    html,body{height:100%;font-family:'Nunito',sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    #root{min-height:100vh}
    .app{min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
    .app::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(251,191,36,.07) 0%,transparent 40%);pointer-events:none;z-index:0}
    .hdr{background:rgba(13,11,37,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer}
    .logo-img{width:38px;height:38px;border-radius:10px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(139,92,246,.6))}
    .logo-text{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#fff 0%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
    .nav{display:flex;gap:4px}
    .nbtn{padding:6px 11px;border:none;background:transparent;border-radius:8px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;color:var(--dim);cursor:pointer;transition:all .15s;white-space:nowrap}
    .nbtn:hover{background:var(--pdim);color:var(--text)}
    .nbtn.on{background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(167,139,250,.2));color:var(--purple2);border:1px solid var(--border)}
    .badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;background:var(--gold);color:#000;border-radius:50%;font-size:.6rem;font-weight:900;margin-left:4px}
    .main{max-width:860px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1}
    .stitle{font-size:1.55rem;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .ssub{color:var(--dim);font-size:.88rem;margin-bottom:24px;font-weight:600}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
    .btn:active{transform:scale(.96)}
    .bp{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:var(--gp)}
    .bp:hover{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
    .bg{background:rgba(255,255,255,.08);color:var(--dim);border:1px solid var(--border)}
    .bg:hover{background:rgba(255,255,255,.12);color:var(--text)}
    .ba{background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;box-shadow:var(--go)}
    .bgrn{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
    .bgold{background:linear-gradient(135deg,#d97706,#fbbf24);color:#000;font-weight:800}
    .ibtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;cursor:pointer;color:var(--dim);font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .ibtn:hover{background:var(--pdim);color:var(--text)}
    .ibtn.del:hover{background:rgba(239,68,68,.2);color:var(--red)}
    .overlay{position:fixed;inset:0;background:rgba(8,5,26,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
    .modal{background:var(--surf);border:1px solid var(--border2);border-radius:18px;padding:24px;width:100%;max-width:460px;box-shadow:0 24px 64px rgba(0,0,0,.6),var(--gp);max-height:90dvh;overflow-y:auto}
    .mtitle{font-size:1.15rem;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
    .fg{margin-bottom:14px}
    .fl{display:block;font-size:.74rem;font-weight:800;color:var(--purple2);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
    .fi,.fta,.fsel{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Nunito',sans-serif;font-size:.93rem;color:var(--text);background:rgba(255,255,255,.05);outline:none;transition:border-color .15s}
    .fi:focus,.fta:focus,.fsel:focus{border-color:var(--purple);background:rgba(139,92,246,.08)}
    .fta{resize:vertical;min-height:80px}
    .fsel option{background:var(--surf)}
    .erow{display:flex;gap:7px;flex-wrap:wrap}
    .eopt{width:36px;height:36px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.07);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .eopt:hover,.eopt.sel{border-color:var(--purple);background:var(--pdim)}
    .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
    .dcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .22s}
    .dcard:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(139,92,246,.3),0 0 0 1px var(--border2)}
    .dcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .demoji{font-size:2rem}
    .dcard-acts{display:flex;gap:3px}
    .dname{font-size:1.05rem;font-weight:800;margin-bottom:3px}
    .dmeta{font-size:.78rem;color:var(--dim)}
    .dpill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-top:9px}
    .dpill.due{background:rgba(249,115,22,.2);color:#fb923c;border:1px solid rgba(249,115,22,.3)}
    .dpill.ok{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
    .add-deck{border:2px dashed var(--border);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--faint);font-size:.88rem;font-weight:700;transition:all .2s;min-height:118px}
    .add-deck:hover{border-color:var(--purple);color:var(--purple2);background:var(--pdim)}
    .bbtn{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:.85rem;cursor:pointer;border:none;background:none;padding:4px 0;margin-bottom:18px;font-weight:700}
    .bbtn:hover{color:var(--purple2)}
    .dhdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .dhl{display:flex;align-items:center;gap:12px}
    .dbige{font-size:2.5rem;filter:drop-shadow(0 0 12px rgba(139,92,246,.5))}
    .dht-name{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .dstats{display:flex;gap:14px;margin-top:4px}
    .ds{font-size:.8rem;color:var(--dim);font-weight:600}
    .ds span{font-weight:800;color:var(--purple2)}
    .clist{display:flex;flex-direction:column;gap:8px}
    .citem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px}
    .citxt{flex:1;min-width:0}
    .cfront{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cback{font-size:.76rem;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctag{font-size:.68rem;color:var(--purple2);flex-shrink:0;white-space:nowrap;font-weight:700}
    .cacts{display:flex;gap:5px;flex-shrink:0}
    .pbar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:26px}
    .pfill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:3px;transition:width .4s}
    .shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
    .scnt{font-size:.88rem;color:var(--dim);font-weight:700}
    .scene{perspective:1000px;width:100%;max-width:520px;height:295px;margin:0 auto 26px;cursor:pointer}
    .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
    .inner.flip{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
    .face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a1540,#2d1b6b)}
    .flabel{position:absolute;top:15px;left:18px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple2);opacity:.7}
    .ftext{font-size:1.4rem;font-weight:700;line-height:1.5}
    .fhint{position:absolute;bottom:14px;font-size:.72rem;color:var(--faint);font-weight:600}
    .sacts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .sacts .btn{padding:12px 28px;font-size:.95rem;border-radius:12px}
    .done{background:var(--surf);border:1px solid var(--border2);border-radius:20px;padding:36px 26px;text-align:center;max-width:400px;margin:44px auto;box-shadow:0 12px 48px rgba(0,0,0,.5),var(--gp)}
    .di{font-size:3rem;margin-bottom:10px}
    .dt{font-size:1.5rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .dsub{color:var(--dim);margin-bottom:20px;font-size:.9rem;font-weight:600}
    .drow{display:flex;gap:24px;justify-content:center;margin-bottom:22px}
    .dstat-n{font-size:2rem;font-weight:900}
    .dstat-n.g{color:var(--green)}
    .dstat-n.r{color:var(--orange)}
    .dstat-l{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
    .rbox{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:480px}
    .rbox-title{font-size:1.1rem;font-weight:800;margin-bottom:5px}
    .rbox-sub{font-size:.83rem;color:var(--dim);margin-bottom:18px;font-weight:600}
    .time-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .time-wrap input[type=time]{font-size:2rem;font-weight:800;font-family:'Nunito',sans-serif;color:var(--text);border:2px solid var(--border);border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.06);outline:none;cursor:pointer;width:170px}
    .time-wrap input[type=time]:focus{border-color:var(--purple)}
    .spill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:700;margin-bottom:16px}
    .spill.on{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
    .spill.off{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.25)}
    .hintbox{margin-top:18px;padding:14px 16px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid var(--border);font-size:.8rem;color:var(--dim);line-height:1.75;font-weight:600}
    .hintbox strong{color:var(--text)}
    .steps{display:flex;flex-direction:column;gap:8px;margin-top:12px}
    .step{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(139,92,246,.08);border-radius:8px;border:1px solid var(--pdim)}
    .snum{width:22px;height:22px;background:var(--purple);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0;margin-top:1px}
    .stxt{font-size:.82rem;line-height:1.5}
    .stxt strong{color:var(--gold)}
    .auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
    .auth-card{background:var(--surf);border:1px solid var(--border2);border-radius:24px;padding:32px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6),var(--gp)}
    .auth-logo{width:100px;height:100px;margin:0 auto 20px;border-radius:24px;filter:drop-shadow(0 0 16px rgba(139,92,246,.6))}
    .auth-title{font-size:1.75rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff 0%,#a78bfa 60%,#fbbf24 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .auth-sub{color:var(--dim);font-size:.9rem;margin-bottom:22px;font-weight:600}
    .auth-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--text);background:rgba(255,255,255,.06);outline:none;text-align:center;transition:border-color .15s;margin-bottom:12px}
    .auth-input:focus{border-color:var(--purple);box-shadow:var(--gp)}
    .auth-btn{width:100%;padding:14px;font-size:1rem;border-radius:12px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;cursor:pointer;transition:all .18s;box-shadow:var(--gp)}
    .auth-btn:hover{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
    .auth-btn:active{transform:scale(.97)}
    .auth-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .info-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:.83rem;font-weight:700;margin-top:10px;width:100%;justify-content:center}
    .info-badge.warn{background:rgba(251,191,36,.12);color:#fcd34d;border:1px solid rgba(251,191,36,.25)}
    .info-badge.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
    .info-badge.ok{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
    .pending-anim{font-size:3.5rem;display:inline-block;margin-bottom:12px;animation:pendingspin 3s linear infinite}
    @keyframes pendingspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .admin-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;gap:10px}
    .admin-uname{font-weight:800;font-size:.9rem;flex:1}
    .admin-time{font-size:.72rem;color:var(--dim);font-weight:600}
    .admin-acts{display:flex;gap:6px;flex-shrink:0}
    .tab-row{display:flex;gap:4px;margin-bottom:14px;background:rgba(255,255,255,.05);padding:4px;border-radius:10px}
    .tab{flex:1;padding:7px;border:none;background:transparent;border-radius:7px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;color:var(--dim);cursor:pointer;text-align:center}
    .tab.on{background:var(--purple);color:#fff;box-shadow:var(--gp)}
    .pill-pending{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:800;background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.25)}
    .pill-ok{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
    .pill-reject{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
    .empty{text-align:center;padding:48px 16px;color:var(--dim)}
    .empty .ei{font-size:3rem;margin-bottom:10px;opacity:.4}
    .empty p{margin-bottom:14px;font-weight:600}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:11px 22px;border-radius:12px;font-size:.88rem;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:400;white-space:nowrap;border:1px solid var(--border2)}
    .admin-link{position:fixed;bottom:8px;right:12px;font-size:.68rem;color:rgba(255,255,255,.15);cursor:pointer;z-index:50;font-weight:600}
    .admin-link:hover{color:var(--purple2)}
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--dim)}
    .spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:pendingspin .8s linear infinite}
    @media(max-width:500px){.scene{height:250px}.ftext{font-size:1.15rem}.sacts .btn{width:100%;justify-content:center}.logo-text{display:none}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;

var EMOJIS = ['📚','🧠','🔬','🌍','✏️','🎵','💡','🏛️','🧮','🌱','💻','🗺️','⚗️','📐','🎨'];

function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ return new Date().toISOString().slice(0,10); }
function plusDays(s,n){ var d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function getDue(deck){ var t=today(); return deck.cards.filter(function(c){ return !c.nextReview||c.nextReview<=t; }); }
function advance(c,knew){
  if(!knew) return Object.assign({},c,{lvl:0,nextReview:today()});
  var lvl=Math.min((c.lvl||0)+1,SRS.length-1);
  return Object.assign({},c,{lvl:lvl,nextReview:plusDays(today(),SRS[lvl])});
}
function loadData(){ try{ var r=localStorage.getItem(LS); return r?JSON.parse(r):{decks:[],reminder:null}; }catch(e){ return {decks:[],reminder:null}; } }
function saveData(d){ try{ localStorage.setItem(LS,JSON.stringify(d)); }catch(e){} }
function swPost(msg){ if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage(msg); }
function idbSet(key,val){
  try{
    var req=indexedDB.open('kk-sw',1);
    req.onupgradeneeded=function(e){ e.target.result.createObjectStore('kv'); };
    req.onsuccess=function(e){ var tx=e.target.result.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key); };
  }catch(e){}
}

// ── Export / Import ──────────────────────────────────────────────────────────
function buildDeckBlob(deck){
  var data = {
    version: 1,
    name: deck.name,
    emoji: deck.emoji,
    exported: today(),
    cards: deck.cards.map(function(c){ return {front:c.front, back:c.back}; })
  };
  var json = JSON.stringify(data, null, 2);
  return {
    blob: new Blob([json], {type:'application/json'}),
    filename: deck.name.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g,'_') + '.kkm.json',
    json: json
  };
}

function downloadDeck(deck){
  var d = buildDeckBlob(deck);
  var url = URL.createObjectURL(d.blob);
  var a = document.createElement('a');
  a.href = url; a.download = d.filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function shareDeck(deck, onFallback){
  var d = buildDeckBlob(deck);
  if(navigator.share){
    var file = new File([d.blob], d.filename, {type:'application/json'});
    var canShareFile = false;
    try{ canShareFile = navigator.canShare && navigator.canShare({files:[file]}); }catch(e){}
    if(canShareFile){
      navigator.share({
        files: [file],
        title: 'Karteikarten: '+deck.name,
        text: deck.cards.length+' Karten'
      }).then(function(){
      }).catch(function(err){
        if(err.name !== 'AbortError') onFallback(d.filename);
      });
      return;
    }
    // Share without file (text only with JSON)
    navigator.share({
      title: 'Karteikarten: '+deck.name,
      text: d.json
    }).then(function(){
    }).catch(function(){
      onFallback(d.filename);
    });
    return;
  }
  // No share API at all – download
  downloadDeck(deck);
  onFallback(d.filename);
}

function importDeckFromJSON(jsonStr){
  try{
    var data = JSON.parse(jsonStr);
    if(!data.cards || !Array.isArray(data.cards)) return null;
    return {
      id: uid(),
      name: data.name || 'Importierter Stapel',
      emoji: data.emoji || '📚',
      created: today(),
      cards: data.cards.map(function(c){
        return {id:uid(), front:c.front||'', back:c.back||'', lvl:0, nextReview:today()};
      }).filter(function(c){ return c.front && c.back; })
    };
  }catch(e){ return null; }
}

function useToast(){
  var st=useState(''); var msg=st[0]; var setMsg=st[1];
  function show(m){ setMsg(m); setTimeout(function(){ setMsg(''); },3000); }
  return [msg,show];
}
function Toast(p){ return p.msg ? h('div',{className:'toast'},p.msg) : null; }

// ── Modals ────────────────────────────────────────────────────────────────────
function DeckModal(p){
  var ns=useState(p.deck?p.deck.name:''); var name=ns[0]; var setName=ns[1];
  var es=useState(p.deck?p.deck.emoji:'📚'); var emoji=es[0]; var setEmoji=es[1];
  function go(){ if(name.trim()) p.onSave({name:name.trim(),emoji:emoji}); }
  return h('div',{className:'overlay',onClick:p.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'mtitle'},p.deck?'Stapel bearbeiten':'✨ Neuer Stapel'),
      h('div',{className:'fg'},h('label',{className:'fl'},'Name'),
        h('input',{className:'fi',value:name,onInput:function(e){setName(e.target.value);},
          placeholder:'z.B. Vokabeln Englisch',autoFocus:true,onKeyDown:function(e){if(e.key==='Enter')go();}})
      ),
      h('div',{className:'fg'},h('label',{className:'fl'},'Symbol'),
        h('div',{className:'erow'},EMOJIS.map(function(e){
          return h('button',{key:e,className:'eopt'+(emoji===e?' sel':''),onClick:function(){setEmoji(e);}},e);
        }))
      ),
      h('div',{className:'mfoot'},
        h('button',{className:'btn bg',onClick:p.onClose},'Abbrechen'),
        h('button',{className:'btn bp',onClick:go},'Speichern')
      )
    )
  );
}

function CardModal(p){
  var fs=useState(p.card?p.card.front:''); var front=fs[0]; var setFront=fs[1];
  var bs=useState(p.card?p.card.back:''); var back=bs[0]; var setBack=bs[1];
  function go(){ if(front.trim()&&back.trim()) p.onSave({front:front.trim(),back:back.trim()}); }
  return h('div',{className:'overlay',onClick:p.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'mtitle'},p.card?'Karte bearbeiten':'🃏 Neue Karte'),
      h('div',{className:'fg'},h('label',{className:'fl'},'Vorderseite – Frage'),
        h('textarea',{className:'fta',value:front,onInput:function(e){setFront(e.target.value);},placeholder:'Frage eingeben…',autoFocus:true})
      ),
      h('div',{className:'fg'},h('label',{className:'fl'},'Rückseite – Antwort'),
        h('textarea',{className:'fta',value:back,onInput:function(e){setBack(e.target.value);},placeholder:'Antwort eingeben…'})
      ),
      h('div',{className:'mfoot'},
        h('button',{className:'btn bg',onClick:p.onClose},'Abbrechen'),
        h('button',{className:'btn bp',onClick:go},'Speichern')
      )
    )
  );
}

function ImportModal(p){
  var ss=useState('idle'); var status=ss[0]; var setStatus=ss[1];
  var ms=useState(''); var msg=ms[0]; var setMsg=ms[1];
  var ps=useState(null); var preview=ps[0]; var setPreview=ps[1];

  function handleFile(e){
    var file = e.target.files[0];
    if(!file){ return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      var deck = importDeckFromJSON(ev.target.result);
      if(!deck){
        setStatus('error');
        setMsg('Ungültige Datei. Bitte eine .kkm.json Datei wählen.');
        return;
      }
      setPreview(deck);
      setStatus('preview');
    };
    reader.readAsText(file);
  }

  function doImport(){
    if(preview) p.onImport(preview);
  }

  return h('div',{className:'overlay',onClick:p.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'mtitle'},'📥 Stapel importieren'),

      status==='idle'&&h('div',null,
        h('div',{style:{background:'rgba(139,92,246,.1)',border:'2px dashed var(--border)',borderRadius:'12px',padding:'24px',textAlign:'center',marginBottom:'16px'}},
          h('div',{style:{fontSize:'2.5rem',marginBottom:'8px'}},'📂'),
          h('div',{style:{fontWeight:700,marginBottom:'6px'}},'Stapel-Datei auswählen'),
          h('div',{style:{fontSize:'.82rem',color:'var(--dim)',marginBottom:'14px'}},'Wähle eine .kkm.json Datei von deinem Gerät'),
          h('label',{style:{cursor:'pointer'}},
            h('span',{className:'btn bp'},'📁 Datei auswählen'),
            h('input',{type:'file',accept:'.json,.kkm.json',style:{display:'none'},onChange:handleFile})
          )
        )
      ),

      status==='error'&&h('div',null,
        h('div',{style:{background:'rgba(239,68,68,.12)',color:'#fca5a5',border:'1px solid rgba(239,68,68,.25)',borderRadius:'10px',padding:'12px',marginBottom:'14px',fontWeight:700}},
          '⚠️ '+msg
        ),
        h('button',{className:'btn bg',onClick:function(){setStatus('idle');setMsg('');}}, '← Zurück')
      ),

      status==='preview'&&preview&&h('div',null,
        h('div',{style:{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.25)',borderRadius:'12px',padding:'16px',marginBottom:'16px'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}},
            h('span',{style:{fontSize:'1.8rem'}},preview.emoji),
            h('div',null,
              h('div',{style:{fontWeight:800,fontSize:'1.05rem'}},preview.name),
              h('div',{style:{fontSize:'.8rem',color:'var(--dim)',fontWeight:600}},preview.cards.length+' Karten')
            )
          ),
          h('div',{style:{fontSize:'.78rem',color:'var(--dim)',fontWeight:600}},'Vorschau (erste 3 Karten):'),
          h('div',{style:{marginTop:'6px'}},preview.cards.slice(0,3).map(function(c,i){
            return h('div',{key:i,style:{background:'rgba(255,255,255,.05)',borderRadius:'6px',padding:'6px 10px',marginTop:'4px',fontSize:'.8rem'}},
              h('span',{style:{fontWeight:700}},c.front),' → ',c.back
            );
          }))
        ),
        h('div',{className:'mfoot'},
          h('button',{className:'btn bg',onClick:function(){setStatus('idle');setPreview(null);}},'Abbrechen'),
          h('button',{className:'btn bgrn',onClick:doImport},'✓ Importieren ('+preview.cards.length+' Karten)')
        )
      )
    )
  );
}

// ── StudyView ─────────────────────────────────────────────────────────────────
function StudyView(p){
  var due=getDue(p.deck);
  var qs=useState(function(){ return due.slice().sort(function(){return Math.random()-.5;}); });
  var queue=qs[0];
  var is=useState(0); var idx=is[0]; var setIdx=is[1];
  var fs=useState(false); var flip=fs[0]; var setFlip=fs[1];
  var rs=useState({k:0,m:0}); var res=rs[0]; var setRes=rs[1];
  var ds=useState(false); var done=ds[0]; var setDone=ds[1];
  var us=useState({}); var upd=us[0]; var setUpd=us[1];

  if(!queue.length) return h('div',{className:'done'},
    h('div',{className:'di'},'✅'),h('div',{className:'dt'},'Alles erledigt!'),
    h('div',{className:'dsub'},'Keine fälligen Karten heute.'),
    h('button',{className:'btn bp',onClick:function(){p.onFinish();}},'Zurück')
  );
  if(done) return h('div',{className:'done'},
    h('div',{className:'di'},'🎉'),h('div',{className:'dt'},'Runde geschafft!'),
    h('div',{className:'dsub'},queue.length+' Karten durchgegangen'),
    h('div',{className:'drow'},
      h('div',null,h('div',{className:'dstat-n g'},res.k),h('div',{className:'dstat-l'},'Gewusst')),
      h('div',null,h('div',{className:'dstat-n r'},res.m),h('div',{className:'dstat-l'},'Noch üben'))
    ),
    h('button',{className:'btn bgold',onClick:function(){p.onFinish(upd);}},'Fertig ✓')
  );

  var card=queue[idx];
  function answer(knew){
    var u=Object.assign({},upd); u[card.id]=advance(card,knew); setUpd(u);
    setRes({k:res.k+(knew?1:0),m:res.m+(knew?0:1)});
    if(idx+1>=queue.length) setDone(true);
    else{ setIdx(idx+1); setFlip(false); }
  }
  return h('div',null,
    h('div',{className:'shdr'},
      h('button',{className:'bbtn',onClick:function(){p.onFinish();}},'← Beenden'),
      h('div',{className:'scnt'},'Karte ',h('strong',null,idx+1),' von ',h('strong',null,queue.length))
    ),
    h('div',{className:'pbar'},h('div',{className:'pfill',style:{width:(idx/queue.length*100)+'%'}})),
    h('div',{className:'scene',onClick:function(){setFlip(!flip);}},
      h('div',{className:'inner'+(flip?' flip':'')},
        h('div',{className:'face'},
          h('span',{className:'flabel'},'Frage'),
          h('div',{className:'ftext'},card.front),
          h('span',{className:'fhint'},'Tippen zum Umdrehen')
        ),
        h('div',{className:'face back'},
          h('span',{className:'flabel'},'Antwort'),
          h('div',{className:'ftext'},card.back)
        )
      )
    ),
    flip
      ? h('div',{className:'sacts'},
          h('button',{className:'btn ba',onClick:function(){answer(false);}},'😅 Noch üben'),
          h('button',{className:'btn bgrn',onClick:function(){answer(true);}},'✓ Gewusst!')
        )
      : h('div',{style:{textAlign:'center',color:'var(--dim)',fontSize:'.88rem',paddingTop:'6px',fontWeight:600}},'Karte antippen um die Antwort zu sehen')
  );
}

// ── DeckDetail ─────────────────────────────────────────────────────────────────
function DeckDetail(p){
  var as=useState(false); var showAdd=as[0]; var setShowAdd=as[1];
  var ec=useState(null); var editC=ec[0]; var setEditC=ec[1];
  var ss=useState(false); var study=ss[0]; var setStudy=ss[1];
  var due=getDue(p.deck);
  var tm=useToast(); var toast=tm[0]; var showToast=tm[1];

  function addCard(d){ p.onUpdate(Object.assign({},p.deck,{cards:p.deck.cards.concat([Object.assign({id:uid()},d,{lvl:0,nextReview:today()})])})); setShowAdd(false); }
  function saveEdit(d){ p.onUpdate(Object.assign({},p.deck,{cards:p.deck.cards.map(function(c){ return c.id===editC.id?Object.assign({},c,d):c; })})); setEditC(null); }
  function delCard(id){ if(!confirm('Karte löschen?')) return; p.onUpdate(Object.assign({},p.deck,{cards:p.deck.cards.filter(function(c){ return c.id!==id; })})); }
  function finish(upd){ if(upd) p.onUpdate(Object.assign({},p.deck,{cards:p.deck.cards.map(function(c){ return upd[c.id]||c; })})); setStudy(false); }
  var sm=useState(false); var showShareModal=sm[0]; var setShowShareModal=sm[1];
  var sf=useState(''); var shareFilename=sf[0]; var setShareFilename=sf[1];

  function handleExport(){
    shareDeck(p.deck, function(filename){
      setShareFilename(filename);
      setShowShareModal(true);
    });
  }

  if(study) return h(StudyView,{deck:p.deck,onFinish:finish});
  return h('div',null,
    h('button',{className:'bbtn',onClick:p.onBack},'← Alle Stapel'),
    h('div',{className:'dhdr'},
      h('div',{className:'dhl'},
        h('div',{className:'dbige'},p.deck.emoji),
        h('div',null,
          h('div',{className:'dht-name'},p.deck.name),
          h('div',{className:'dstats'},
            h('div',{className:'ds'},h('span',null,p.deck.cards.length),' Karten'),
            h('div',{className:'ds'},h('span',null,due.length),' fällig')
          )
        )
      ),
      h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},
        due.length>0&&h('button',{className:'btn ba',onClick:function(){setStudy(true);}},'▶ Lernen ('+due.length+')'),
        h('button',{className:'btn bp',onClick:function(){setShowAdd(true);}},'+ Karte'),
        h('button',{className:'btn bg',onClick:handleExport},'📤 Teilen')
      )
    ),
    p.deck.cards.length===0
      ? h('div',{className:'empty'},h('div',{className:'ei'},'📭'),h('p',null,'Noch keine Karten.'),h('button',{className:'btn bp',onClick:function(){setShowAdd(true);}},'Erste Karte erstellen'))
      : h('div',{className:'clist'},p.deck.cards.map(function(c){
          return h('div',{className:'citem',key:c.id},
            h('div',{className:'citxt'},h('div',{className:'cfront'},c.front),h('div',{className:'cback'},c.back)),
            h('div',{className:'ctag'},c.nextReview<=today()?'⏰ fällig':'📅 '+c.nextReview),
            h('div',{className:'cacts'},
              h('button',{className:'ibtn',onClick:function(){setEditC(c);}},'✏️'),
              h('button',{className:'ibtn del',onClick:function(){delCard(c.id);}},'🗑️')
            )
          );
        })),
    showAdd&&h(CardModal,{onSave:addCard,onClose:function(){setShowAdd(false);}}),
    editC&&h(CardModal,{card:editC,onSave:saveEdit,onClose:function(){setEditC(null);}}),
    showShareModal&&h(ShareModal,{deck:p.deck,filename:shareFilename,onClose:function(){setShowShareModal(false);}}),
    h(Toast,{msg:toast})
  );
}

// ── ReminderSettings ──────────────────────────────────────────────────────────
function ReminderSettings(p){
  var ts=useState(p.reminder?p.reminder.time:'08:00'); var time=ts[0]; var setTime=ts[1];
  var ps=useState(typeof Notification!=='undefined'?Notification.permission:'default'); var perm=ps[0]; var setPerm=ps[1];
  var tm=useToast(); var toast=tm[0]; var showToast=tm[1];
  var dueTotal=p.decks.reduce(function(s,d){return s+getDue(d).length;},0);

  function enable(){
    if(perm!=='granted'){
      Notification.requestPermission().then(function(np){
        setPerm(np);
        if(np!=='granted'){showToast('❌ Benachrichtigungen im Browser erlauben!');return;}
        doSave();
      });
    } else { doSave(); }
  }
  function doSave(){
    idbSet('notifyTime',time); idbSet('dueCount',dueTotal); idbSet('lastNotified',null);
    swPost({type:'SET_NOTIFY_TIME',time:time,dueCount:dueTotal});
    p.onSave({time:time}); showToast('✅ Erinnerung gesetzt!');
  }
  function disable(){ swPost({type:'DISABLE_NOTIFY'}); idbSet('notifyTime',null); p.onSave(null); showToast('🔕 Deaktiviert.'); }

  return h('div',null,
    h('div',{className:'stitle'},'Erinnerung'),
    h('div',{className:'ssub'},'Täglich zur gewählten Uhrzeit erinnert werden.'),
    h('div',{className:'rbox'},
      h('div',{className:'rbox-title'},'🔔 Täglich erinnern um …'),
      h('div',{className:'rbox-sub'},'Genau einmal täglich – zur Uhrzeit deiner Wahl.'),
      h('div',{className:'spill '+(p.reminder?'on':'off')},p.reminder?'✅ Aktiv um '+p.reminder.time+' Uhr':'⭕ Noch nicht aktiv'),
      perm==='denied'&&h('div',{style:{background:'rgba(239,68,68,.12)',color:'#fca5a5',borderRadius:'10px',padding:'10px 14px',fontSize:'.83rem',fontWeight:700,marginBottom:'12px',border:'1px solid rgba(239,68,68,.25)'}},'⛔ Benachrichtigungen blockiert'),
      h('div',{className:'time-wrap'},
        h('input',{type:'time',value:time,onChange:function(e){setTime(e.target.value);}}),
        h('span',{style:{color:'var(--dim)',fontWeight:700}},'Uhr')
      ),
      h('div',{style:{display:'flex',gap:'9px',flexWrap:'wrap'}},
        h('button',{className:'btn ba',onClick:enable},perm==='granted'&&p.reminder?'💾 Zeit speichern':'🔔 Erinnerung aktivieren'),
        p.reminder&&h('button',{className:'btn bg',onClick:disable},'Deaktivieren')
      ),
      h('div',{className:'hintbox'},
        h('strong',null,'📱 App installieren für beste Ergebnisse:'),
        h('div',{className:'steps'},
          h('div',{className:'step'},h('div',{className:'snum'},'1'),h('div',{className:'stxt'},h('strong',null,'iPhone:'),' Safari → Teilen → „Zum Home-Bildschirm"')),
          h('div',{className:'step'},h('div',{className:'snum'},'2'),h('div',{className:'stxt'},h('strong',null,'Android:'),' Chrome → Menü → „App installieren"')),
          h('div',{className:'step'},h('div',{className:'snum'},'3'),h('div',{className:'stxt'},'Erinnerung aktivieren → fertig! 🎉'))
        )
      )
    ),
    h(Toast,{msg:toast})
  );
}


// ── QuickStudy Flow ───────────────────────────────────────────────────────────
// Step 1: Select decks
function DeckSelectModal(p){
  var decksWithDue = p.decks.filter(function(d){ return d.cards.length > 0; });
  var sel_s = useState(function(){ 
    // Pre-select decks that have due cards
    var due = decksWithDue.filter(function(d){ return getDue(d).length > 0; });
    return due.length > 0 ? due.map(function(d){ return d.id; }) : (decksWithDue.length > 0 ? [decksWithDue[0].id] : []);
  });
  var selected = sel_s[0]; var setSelected = sel_s[1];

  function toggle(id){
    if(selected.indexOf(id) >= 0){
      setSelected(selected.filter(function(s){ return s !== id; }));
    } else {
      setSelected(selected.concat([id]));
    }
  }
  function selectAll(){ setSelected(decksWithDue.map(function(d){ return d.id; })); }
  function selectNone(){ setSelected([]); }

  var totalCards = p.decks.filter(function(d){ return selected.indexOf(d.id) >= 0; })
    .reduce(function(s,d){ return s + d.cards.length; }, 0);
  var dueCards = p.decks.filter(function(d){ return selected.indexOf(d.id) >= 0; })
    .reduce(function(s,d){ return s + getDue(d).length; }, 0);

  if(decksWithDue.length === 0) return h('div',{className:'overlay',onClick:p.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'mtitle'},'Jetzt lernen'),
      h('div',{style:{textAlign:'center',padding:'20px',color:'var(--dim)',fontWeight:600}},
        h('div',{style:{fontSize:'3rem',marginBottom:'10px'}},'📭'),
        'Noch keine Karten vorhanden. Erstelle zuerst Stapel mit Karten.'
      ),
      h('div',{className:'mfoot'},h('button',{className:'btn bg',onClick:p.onClose},'OK'))
    )
  );

  return h('div',{className:'overlay',onClick:p.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'mtitle'},'🎯 Welche Stapel lernen?'),
      // Select all / none
      h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},
        h('button',{className:'btn bg',style:{padding:'5px 12px',fontSize:'.78rem'},onClick:selectAll},'Alle'),
        h('button',{className:'btn bg',style:{padding:'5px 12px',fontSize:'.78rem'},onClick:selectNone},'Keine')
      ),
      // Deck list
      h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}},
        decksWithDue.map(function(deck){
          var isSelected = selected.indexOf(deck.id) >= 0;
          var due = getDue(deck).length;
          return h('button',{
            key:deck.id,
            style:{
              display:'flex',alignItems:'center',gap:'12px',padding:'12px 14px',
              borderRadius:'10px',cursor:'pointer',transition:'all .15s',width:'100%',
              textAlign:'left',fontFamily:"'Nunito',sans-serif",
              background: isSelected ? 'rgba(139,92,246,.2)' : 'rgba(255,255,255,.04)',
              border: isSelected ? '1.5px solid var(--purple)' : '1.5px solid var(--border)',
              color:'var(--text)'
            },
            onClick:function(){ toggle(deck.id); }
          },
            h('div',{style:{
              width:'22px',height:'22px',borderRadius:'6px',flexShrink:0,
              background: isSelected ? 'var(--purple)' : 'transparent',
              border: isSelected ? '2px solid var(--purple)' : '2px solid var(--border)',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.75rem'
            }}, isSelected ? '✓' : ''),
            h('div',{style:{fontSize:'1.4rem'}},deck.emoji),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontWeight:700,fontSize:'.95rem'}},deck.name),
              h('div',{style:{fontSize:'.75rem',color:'var(--dim)',fontWeight:600}},
                deck.cards.length+' Karten',
                due > 0 ? h('span',{style:{color:'#fb923c',marginLeft:'6px'}}, '⏰ '+due+' fällig') : ''
              )
            )
          );
        })
      ),
      // Summary
      selected.length > 0 && h('div',{style:{
        background:'rgba(139,92,246,.1)',border:'1px solid var(--border)',
        borderRadius:'10px',padding:'10px 14px',marginBottom:'16px',
        fontSize:'.82rem',fontWeight:600,color:'var(--dim)'
      }},
        h('span',{style:{color:'var(--text)'}},selected.length+' Stapel'),
        ' ausgewählt · '+totalCards+' Karten',
        dueCards > 0 ? h('span',{style:{color:'#fb923c'}}, ' · '+dueCards+' fällig') : ''
      ),
      h('div',{className:'mfoot'},
        h('button',{className:'btn bg',onClick:p.onClose},'Abbrechen'),
        h('button',{
          className:'btn bgold',
          onClick:function(){
            if(selected.length > 0) p.onNext(p.decks.filter(function(d){ return selected.indexOf(d.id) >= 0; }));
          },
          disabled: selected.length === 0
        },'Weiter →')
      )
    )
  );
}

        h('div',{style:{fontSize:'.82rem',color:'var(--dim)',fontWeight:600}},'Einen Stapel nach dem anderen. Reihenfolge im nächsten Schritt wählen.')

// Multi-deck study runner
function MultiStudyView(p){
  // config: {mode:'mixed'} or {mode:'sequential', random:bool}
  var config = p.config;
  var decks = p.decks;

  // Build queue
  var queue_s = useState(function(){
    if(config.mode === 'mixed'){
      var all = [];
      decks.forEach(function(d){
        d.cards.forEach(function(c){ all.push(Object.assign({},c,{_deckName:d.name,_deckEmoji:d.emoji})); });
      });
      return all.sort(function(){return Math.random()-.5;});
    } else {
      // sequential
      var orderedDecks = config.random ? decks.slice().sort(function(){return Math.random()-.5;}) : decks.slice();
      var all = [];
      orderedDecks.forEach(function(d){
        var cards = d.cards.slice().sort(function(){return Math.random()-.5;});
        cards.forEach(function(c){ all.push(Object.assign({},c,{_deckName:d.name,_deckEmoji:d.emoji})); });
      });
      return all;
    }
  });
  var queue = queue_s[0];

  var is = useState(0); var idx = is[0]; var setIdx = is[1];
  var fs = useState(false); var flip = fs[0]; var setFlip = fs[1];
  var rs = useState({k:0,m:0}); var res = rs[0]; var setRes = rs[1];
  var ds = useState(false); var done = ds[0]; var setDone = ds[1];
  var us = useState({}); var upd = us[0]; var setUpd = us[1];

  if(!queue.length) return h('div',{className:'done'},
    h('div',{className:'di'},'📭'),
    h('div',{className:'dt'},'Keine Karten!'),
    h('div',{className:'dsub'},'Die ausgewählten Stapel haben keine Karten.'),
    h('button',{className:'btn bp',onClick:function(){p.onFinish();}}, 'Zurück')
  );

  if(done) return h('div',{className:'done'},
    h('div',{className:'di'},'🎉'),
    h('div',{className:'dt'},'Fertig!'),
    h('div',{className:'dsub'},queue.length+' Karten aus '+decks.length+' Stapeln'),
    h('div',{className:'drow'},
      h('div',null,h('div',{className:'dstat-n g'},res.k),h('div',{className:'dstat-l'},'Gewusst')),
      h('div',null,h('div',{className:'dstat-n r'},res.m),h('div',{className:'dstat-l'},'Noch üben'))
    ),
    h('button',{className:'btn bgold',onClick:function(){p.onFinish(upd);}},'Fertig ✓')
  );

  var card = queue[idx];
  function answer(knew){
    var u = Object.assign({},upd); u[card.id] = advance(card,knew); setUpd(u);
    setRes({k:res.k+(knew?1:0),m:res.m+(knew?0:1)});
    if(idx+1 >= queue.length) setDone(true);
    else{ setIdx(idx+1); setFlip(false); }
  }

  return h('div',null,
    h('div',{className:'shdr'},
      h('button',{className:'bbtn',onClick:function(){p.onFinish();}},'← Beenden'),
      h('div',{className:'scnt'},'Karte ',h('strong',null,idx+1),' von ',h('strong',null,queue.length))
    ),
    // Deck indicator
    h('div',{style:{textAlign:'center',marginBottom:'8px',fontSize:'.78rem',color:'var(--purple2)',fontWeight:700}},
      card._deckEmoji+' '+card._deckName
    ),
    h('div',{className:'pbar'},h('div',{className:'pfill',style:{width:(idx/queue.length*100)+'%'}})),
    h('div',{className:'scene',onClick:function(){setFlip(!flip);}},
      h('div',{className:'inner'+(flip?' flip':'')},
        h('div',{className:'face'},
          h('span',{className:'flabel'},'Frage'),
          h('div',{className:'ftext'},card.front),
          h('span',{className:'fhint'},'Tippen zum Umdrehen')
        ),
        h('div',{className:'face back'},
          h('span',{className:'flabel'},'Antwort'),
          h('div',{className:'ftext'},card.back)
        )
      )
    ),
    flip
      ? h('div',{className:'sacts'},
          h('button',{className:'btn ba',onClick:function(){answer(false);}},'😅 Noch üben'),
          h('button',{className:'btn bgrn',onClick:function(){answer(true);}},'✓ Gewusst!')
        )
      : h('div',{style:{textAlign:'center',color:'var(--dim)',fontSize:'.88rem',paddingTop:'6px',fontWeight:600}},'Karte antippen um die Antwort zu sehen')
  );
}

          h('button',{
            style:{
              background:'rgba(139,92,246,.12)',border:'1px solid rgba(139,92,246,.3)',
              color:'var(--purple2)',fontSize:'.82rem',fontWeight:700,cursor:'pointer',
              fontFamily:"'Nunito',sans-serif",padding:'8px 16px',borderRadius:'8px'
            },
            onClick:function(){setShowDatenschutz(true);}
          },'Datenschutz')
        )
      ),
      view==='decks'&&active&&!qsStep&&h(DeckDetail,{deck:active,onBack:function(){setDeckId(null);},
        onUpdate:function(u){patch({decks:decks.map(function(d){return d.id===u.id?u:d;})});}}),
      qsStep==='study'&&h(MultiStudyView,{
        decks:qsDecks,
        config:qsConfig,
        onFinish:function(upd){
          if(upd){
            var newDecks=decks.map(function(d){
              var updated=qsDecks.find(function(qd){return qd.id===d.id;});
              if(!updated) return d;
              return Object.assign({},d,{cards:d.cards.map(function(c){return upd[c.id]||c;})});
            });
            patch({decks:newDecks});
          }
          setQsStep(null); setQsConfig(null); setQsDecks([]);
        }
      }),
      view==='reminder'&&h(ReminderSettings,{reminder:data.reminder,decks:decks,onSave:function(r){patch({reminder:r});}})
    ),
    showNew&&h(DeckModal,{onSave:addDeck,onClose:function(){setShowNew(false);}}),
    editD&&h(DeckModal,{deck:editD,onSave:saveDeckEdit,onClose:function(){setEditD(null);}}),
    showImport&&h(ImportModal,{onImport:handleImport,onClose:function(){setShowImport(false);}}),
    // QuickStudy flow
    qsStep==='select'&&h(DeckSelectModal,{
      decks:decks,
      onNext:function(selected){ setQsDecks(selected); setQsStep('mode'); },
      onClose:function(){ setQsStep(null); }
    }),
    qsStep==='mode'&&h(StudyModeModal,{
      decks:qsDecks,
      onStart:function(config){ setQsConfig(config); setQsStep('study'); },
      onDeckByDeck:function(){ setQsStep('order'); },
      onBack:function(){ setQsStep('select'); },
      onClose:function(){ setQsStep(null); }
    }),
    qsStep==='order'&&h(DeckOrderModal,{
      decks:qsDecks,
      onStart:function(config){ setQsConfig(config); setQsStep('study'); },
      onBack:function(){ setQsStep('mode'); },
      onClose:function(){ setQsStep(null); }
    }),
    showHelp&&h(HelpModal,{onClose:function(){setShowHelp(false);}}),
    showImpressum&&h(ImpressumModal,{onClose:function(){setShowImpressum(false);}}),
    showDatenschutz&&h(DatenschutzModal,{onClose:function(){setShowDatenschutz(false);}}),
    h(Toast,{msg:toast})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js')
      .then(function(){ console.log('[KKM] SW aktiv'); })
      .catch(function(){ });
  });
}
</script>
</body>
</html>
